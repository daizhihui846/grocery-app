<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>菜篮子 — 卡通买菜小程序</title>
<style>
*, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

:root {
  --pink: #FF6B8A;
  --green: #5CB85C;
  --yellow: #FFB347;
  --orange: #FF7B42;
  --blue: #5BC0DE;
  --purple: #B07CD8;
  --bg: #FFF8F0;
  --card: #FFFFFF;
  --text: #4A3728;
  --sub: #8B7355;
  --border: #E8D5C4;
}

body {
  font-family: "PingFang SC", "Microsoft YaHei", "Noto Sans SC", sans-serif;
  background: var(--bg);
  color: var(--text);
  min-height: 100vh;
  padding-bottom: 80px;
  -webkit-font-smoothing: antialiased;
  background-image:
    radial-gradient(circle at 10% 20%, rgba(255,179,71,0.08) 0%, transparent 50%),
    radial-gradient(circle at 90% 80%, rgba(255,107,138,0.06) 0%, transparent 50%),
    radial-gradient(circle at 50% 50%, rgba(91,192,222,0.05) 0%, transparent 50%);
}

/* ============ HEADER ============ */
.header {
  background: linear-gradient(135deg, #FF7B42, #FF6B8A, #FFB347);
  background-size: 200% 200%;
  animation: headerShimmer 8s ease-in-out infinite;
  padding: 20px 16px 24px;
  text-align: center;
  color: #fff;
  position: sticky;
  top: 0;
  z-index: 50;
  box-shadow: 0 4px 20px rgba(255,107,138,0.25);
  border-radius: 0 0 28px 28px;
}

@keyframes headerShimmer {
  0%, 100% { background-position: 0% 50%; }
  50% { background-position: 100% 50%; }
}

.header h1 {
  font-size: 1.6rem;
  letter-spacing: 0.04em;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
}

.header h1 .bounce {
  display: inline-block;
  animation: vegBounce 1s ease-in-out infinite;
}
.header h1 .bounce:nth-child(2) { animation-delay: 0.15s; }
.header h1 .bounce:nth-child(3) { animation-delay: 0.3s; }

@keyframes vegBounce {
  0%, 100% { transform: translateY(0); }
  50% { transform: translateY(-6px); }
}

.cart-badge {
  position: fixed;
  top: 14px;
  right: 16px;
  z-index: 60;
  background: #fff;
  color: var(--pink);
  width: 36px;
  height: 36px;
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  font-weight: 700;
  font-size: 0.85rem;
  box-shadow: 0 3px 12px rgba(0,0,0,0.15);
  transition: transform 0.2s;
  cursor: pointer;
}

.cart-badge.pop { animation: popBadge 0.4s ease-out; }
@keyframes popBadge {
  0% { transform: scale(1); }
  50% { transform: scale(1.4); }
  100% { transform: scale(1); }
}

/* ============ CATEGORY TABS (inside veg page) ============ */
.cat-tabs {
  display: flex;
  gap: 8px;
  padding: 14px 16px 8px;
  overflow-x: auto;
  scrollbar-width: none;
  -ms-overflow-style: none;
  flex-wrap: nowrap;
}
.cat-tabs::-webkit-scrollbar { display: none; }

.cat-tab {
  flex-shrink: 0;
  padding: 8px 18px;
  border-radius: 20px;
  border: 2px solid var(--border);
  background: #fff;
  font-size: 0.82rem;
  font-weight: 600;
  color: var(--sub);
  cursor: pointer;
  transition: all 0.25s;
  white-space: nowrap;
}
.cat-tab.active {
  background: var(--green);
  color: #fff;
  border-color: var(--green);
  box-shadow: 0 3px 12px rgba(92,184,92,0.25);
  transform: translateY(-2px);
}

/* ============ VEG GRID ============ */
.veg-grid {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 12px;
  padding: 12px 16px 20px;
}

.veg-card {
  background: #fff;
  border-radius: 18px;
  padding: 16px 10px 14px;
  text-align: center;
  border: 2px solid #F5EDE5;
  cursor: pointer;
  transition: all 0.25s cubic-bezier(0.18, 0.89, 0.32, 1.28);
  position: relative;
  overflow: hidden;
}
.veg-card:hover {
  transform: translateY(-4px);
  box-shadow: 0 8px 24px rgba(0,0,0,0.08);
  border-color: var(--green);
}
.veg-card:active {
  transform: scale(0.95);
}

.veg-emoji {
  font-size: 2.8rem;
  display: block;
  margin-bottom: 6px;
  animation: floatItem 3s ease-in-out infinite;
}
.veg-card:nth-child(odd) .veg-emoji { animation-delay: 0s; }
.veg-card:nth-child(even) .veg-emoji { animation-delay: 0.5s; }

@keyframes floatItem {
  0%, 100% { transform: translateY(0) rotate(0deg); }
  25% { transform: translateY(-4px) rotate(-3deg); }
  75% { transform: translateY(-2px) rotate(3deg); }
}

.veg-name {
  font-size: 0.85rem;
  font-weight: 700;
  color: var(--text);
  margin-bottom: 4px;
}

.veg-price {
  font-size: 0.72rem;
  color: var(--orange);
  font-weight: 600;
}

.veg-add {
  display: inline-block;
  width: 32px;
  height: 32px;
  border-radius: 50%;
  background: var(--green);
  color: #fff;
  font-size: 1.2rem;
  line-height: 32px;
  margin-top: 6px;
  border: none;
  cursor: pointer;
  transition: all 0.2s;
  box-shadow: 0 3px 8px rgba(92,184,92,0.3);
}
.veg-add:hover { background: #4CA84C; transform: scale(1.1); }
.veg-add:active { transform: scale(0.9); }

.veg-qty {
  position: absolute;
  top: 6px;
  right: 8px;
  background: var(--pink);
  color: #fff;
  width: 22px;
  height: 22px;
  border-radius: 50%;
  font-size: 0.7rem;
  font-weight: 700;
  display: flex;
  align-items: center;
  justify-content: center;
  animation: popBadge 0.3s;
}

/* ============ MENU SECTION ============ */
.menu-list {
  padding: 12px 16px 20px;
  display: flex;
  flex-direction: column;
  gap: 14px;
}

.menu-card {
  background: #fff;
  border-radius: 20px;
  padding: 18px 16px;
  border: 2px solid #F5EDE5;
  transition: all 0.25s;
  cursor: pointer;
  position: relative;
  overflow: hidden;
}
.menu-card:hover {
  box-shadow: 0 6px 20px rgba(0,0,0,0.06);
  border-color: var(--orange);
}
.menu-card:active { transform: scale(0.98); }

.menu-card::after {
  content: '';
  position: absolute;
  top: -20px;
  right: -20px;
  width: 80px;
  height: 80px;
  border-radius: 50%;
  background: rgba(255,179,71,0.08);
  pointer-events: none;
}

.menu-header {
  display: flex;
  align-items: center;
  gap: 12px;
  margin-bottom: 8px;
}

.menu-icon {
  font-size: 2.4rem;
}
.menu-title { font-size: 1.05rem; font-weight: 700; }
.menu-tag {
  font-size: 0.68rem;
  padding: 3px 10px;
  border-radius: 12px;
  background: #FFF0E6;
  color: var(--orange);
  font-weight: 600;
  margin-left: auto;
}

.menu-ingredients {
  display: flex;
  flex-wrap: wrap;
  gap: 6px;
  margin: 8px 0;
}

.menu-ingredient {
  font-size: 0.7rem;
  padding: 3px 10px;
  border-radius: 12px;
  background: #F0F9F0;
  color: var(--green);
  font-weight: 500;
}

.menu-desc {
  font-size: 0.76rem;
  color: var(--sub);
  line-height: 1.7;
  background: #FFFAF5;
  padding: 10px 12px;
  border-radius: 10px;
  margin-top: 8px;
}

.menu-detail-toggle {
  display: inline-block;
  font-size: 0.7rem;
  color: var(--orange);
  cursor: pointer;
  margin-top: 4px;
  font-weight: 600;
}

.menu-desc-full {
  white-space: pre-line;
}

/* ============ MENU SEARCH ============ */
.menu-search {
  padding: 10px 16px 4px;
  max-width: 700px;
  margin: 0 auto;
}
.menu-search input {
  width: 100%;
  padding: 10px 16px;
  border-radius: 22px;
  border: 2px solid #E8D5C4;
  font-size: 0.9rem;
  outline: none;
  background: #fff;
  transition: border 0.2s;
}
.menu-search input:focus { border-color: var(--orange); }

.menu-add-all {
  margin-top: 8px;
  padding: 6px 16px;
  border-radius: 16px;
  border: 2px solid var(--green);
  background: #fff;
  color: var(--green);
  font-weight: 700;
  font-size: 0.76rem;
  cursor: pointer;
  transition: all 0.2s;
}
.menu-add-all:hover {
  background: var(--green);
  color: #fff;
}

/* ============ CART SECTION ============ */
.cart-list {
  padding: 12px 16px 20px;
  display: flex;
  flex-direction: column;
  gap: 10px;
}

.cart-item {
  background: #fff;
  border-radius: 16px;
  padding: 14px 16px;
  display: flex;
  align-items: center;
  gap: 12px;
  border: 2px solid #F5EDE5;
  animation: slideIn 0.3s ease-out;
}

@keyframes slideIn {
  from { opacity: 0; transform: translateX(-20px); }
  to { opacity: 1; transform: translateX(0); }
}

.cart-item-emoji { font-size: 2rem; }
.cart-item-info { flex: 1; }
.cart-item-name { font-weight: 700; font-size: 0.9rem; }
.cart-item-price { font-size: 0.72rem; color: var(--sub); }

.cart-qty-wrap {
  display: flex;
  align-items: center;
  gap: 10px;
}

.cart-qty-btn {
  width: 30px; height: 30px;
  border-radius: 50%;
  border: 2px solid var(--border);
  background: #fff;
  font-size: 1rem;
  font-weight: 700;
  cursor: pointer;
  color: var(--text);
  display: flex;
  align-items: center;
  justify-content: center;
  transition: all 0.15s;
}
.cart-qty-btn:hover { border-color: var(--pink); color: var(--pink); }
.cart-qty-btn:active { transform: scale(0.9); }

.cart-qty-num {
  font-size: 0.95rem;
  font-weight: 700;
  min-width: 20px;
  text-align: center;
}

.cart-item-del {
  color: #ccc;
  cursor: pointer;
  font-size: 1.1rem;
  transition: color 0.2s;
}
.cart-item-del:hover { color: var(--pink); }

/* ============ CART FOOTER ============ */
.cart-footer {
  position: fixed;
  bottom: 70px;
  left: 16px;
  right: 16px;
  background: #fff;
  border-radius: 16px;
  padding: 14px 18px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  box-shadow: 0 -2px 16px rgba(0,0,0,0.06);
  border: 2px solid #F5EDE5;
}

.cart-total { font-weight: 700; font-size: 0.95rem; }
.cart-total span { color: var(--pink); font-size: 1.1rem; }

.cart-clear {
  padding: 8px 18px;
  border-radius: 20px;
  border: none;
  background: #FFF0F0;
  color: var(--pink);
  font-weight: 700;
  cursor: pointer;
  font-size: 0.78rem;
  transition: all 0.2s;
}
.cart-clear:hover { background: var(--pink); color: #fff; }

/* ============ BOTTOM NAV ============ */
.bottom-nav {
  position: fixed;
  bottom: 0;
  left: 0;
  right: 0;
  background: #fff;
  display: flex;
  border-top: 2px solid #F5EDE5;
  box-shadow: 0 -4px 16px rgba(0,0,0,0.04);
  z-index: 50;
  border-radius: 20px 20px 0 0;
}

.nav-item {
  flex: 1;
  text-align: center;
  padding: 10px 0 8px;
  cursor: pointer;
  transition: all 0.2s;
  color: var(--sub);
  position: relative;
}

.nav-item.active {
  color: var(--orange);
}

.nav-item.active::before {
  content: '';
  position: absolute;
  top: 0;
  left: 30%;
  right: 30%;
  height: 3px;
  background: var(--orange);
  border-radius: 0 0 3px 3px;
}

.nav-icon { font-size: 1.5rem; display: block; }
.nav-label { font-size: 0.7rem; font-weight: 600; margin-top: 2px; }

.nav-item .mini-badge {
  position: absolute;
  top: 4px;
  right: 50%;
  transform: translateX(18px);
  background: var(--pink);
  color: #fff;
  width: 18px;
  height: 18px;
  border-radius: 50%;
  font-size: 0.65rem;
  font-weight: 700;
  display: flex;
  align-items: center;
  justify-content: center;
}

/* ============ EMPTY STATE ============ */
.empty {
  text-align: center;
  padding: 60px 20px;
  color: var(--sub);
}
.empty-icon { font-size: 4rem; display: block; margin-bottom: 12px; }
.empty-text { font-size: 0.95rem; }

/* ============ PAGE CONTAINER ============ */
.page { display: none; }
.page.active { display: block; animation: fadePage 0.3s; }
@keyframes fadePage { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

/* ============ RESPONSIVE ============ */
@media (min-width: 768px) {
  .veg-grid { grid-template-columns: repeat(4, 1fr); max-width: 900px; margin: 0 auto; }
  .menu-list { max-width: 800px; margin: 0 auto; }
  .menu-search { max-width: 800px; }
  .cart-list { max-width: 700px; margin: 0 auto; }
  .cart-footer { max-width: 700px; left: 50%; transform: translateX(-50%); }
}

@media (max-width: 380px) {
  .veg-grid { grid-template-columns: repeat(2, 1fr); gap: 8px; padding: 8px; }
  .veg-card { padding: 12px 6px 10px; }
  .veg-emoji { font-size: 2.2rem; }
  .cat-tab { padding: 6px 12px; font-size: 0.74rem; }
}
</style>
</head>
<body>

<!-- Header -->
<div class="header">
  <h1>
    <span class="bounce">🥬</span>
    <span class="bounce">菜篮子</span>
    <span class="bounce">🛒</span>
  </h1>
</div>

<!-- Cart Badge -->
<div class="cart-badge" id="cartBadge" onclick="switchTab('cart')" title="购物车">0</div>

<!-- ============ PAGE 1: SHOP ============ -->
<div class="page active" id="page-shop">
  <div class="cat-tabs" id="catTabs"></div>
  <div class="veg-grid" id="vegGrid"></div>
</div>

<!-- ============ PAGE 2: MENUS ============ -->
<div class="page" id="page-menu">
  <div class="menu-search">
    <input type="text" id="menuSearchInput" placeholder="🔍 搜索50道菜谱..." oninput="renderMenuList()">
  </div>
  <div class="menu-list" id="menuList"></div>
</div>

<!-- ============ PAGE 3: CART ============ -->
<div class="page" id="page-cart">
  <div class="cart-list" id="cartList"></div>
  <div class="cart-footer" id="cartFooter" style="display:none">
    <div class="cart-total">合计 <span id="cartTotalPrice">¥0</span></div>
    <button class="cart-clear" onclick="clearCart()">🗑 清空</button>
  </div>
  <div class="empty" id="cartEmpty">
    <span class="empty-icon">🛒</span>
    <p class="empty-text">购物车空空如也~<br>去挑点好吃的吧！</p>
  </div>
</div>

<!-- Bottom Nav -->
<div class="bottom-nav">
  <div class="nav-item active" id="nav-shop" onclick="switchTab('shop')">
    <span class="nav-icon">🥬</span>
    <span class="nav-label">买菜</span>
  </div>
  <div class="nav-item" id="nav-menu" onclick="switchTab('menu')">
    <span class="nav-icon">🍳</span>
    <span class="nav-label">推荐菜单</span>
  </div>
  <div class="nav-item" id="nav-cart" onclick="switchTab('cart')">
    <span class="nav-icon">🛒</span>
    <span class="nav-label">购物车</span>
    <span class="mini-badge" id="navCartBadge" style="display:none">0</span>
  </div>
</div>

<script>
// ============ DATA ============
const categories = [
  { id: 'leaf', name: '🥬 叶菜', emoji: '🥬' },

const menus = [

  { id:'m1',name:'公瑾爆蛋',icon:'🍳🔥',tag:'2026爆款',ingredients:['鸡蛋','番茄酱','生抽','糖','醋'],desc:'【2026全网刷屏】鸡蛋煎至边缘焦脆蛋黄流心。糖醋汁：5勺水+4勺番茄酱+3勺糖+2勺醋+1勺淀粉。淋汁小火收浓，盖饭一绝。麻辣3.0版加豆豉老干妈+小米辣。⚠️用无菌蛋。' },
  { id:'m2',name:'鹌鹑蛋把子肉',icon:'🍖🥚',tag:'抖音刷屏',ingredients:['五花肉','鹌鹑蛋','八角','桂皮','香叶','花椒','冰糖'],desc:'【2025播放2亿】五花肉切0.5cm片煎至两面金黄。鹌鹑蛋煮8分钟剥壳，煎出虎皮纹。冰糖炒糖色至褐色起泡，加开水，放肉+生抽+老抽+八角桂皮香叶花椒，小火炖1.5h，加鹌鹑蛋再炖20min，大火收汁。' },
  { id:'m3',name:'鸡蛋爆豆腐',icon:'🥚🧈',tag:'懒人必学',ingredients:['嫩豆腐','鸡蛋','蒜','小米辣','生抽','蚝油'],desc:'【5分钟快手】嫩豆腐切块，蛋液直接倒在豆腐上。热油快速翻炒使蛋裹住每块豆腐。另锅炒香蒜末小米辣，倒回豆腐，加盐鸡精生抽蚝油大火翻炒1分钟，撒蒜叶出锅。' },
  { id:'m4',name:'蒜香鱼片',icon:'🐟🧄',tag:'鲜嫩滑口',ingredients:['鱼片','蒜','蛋清','淀粉','小米辣','生抽','蚝油'],desc:'【抖音百万赞】鱼片洗净挤干→盐+胡椒粉抓匀→蛋清+淀粉上浆→封油腌10min。水微开转小火，鱼片滑入烫25秒捞出。热油炒蒜末小米辣+生抽蚝油，倒鱼片大火快翻，撒葱花。' },
  { id:'m5',name:'糖醋荷包蛋',icon:'🍳🫙',tag:'糖醋控',ingredients:['鸡蛋','番茄酱','糖','醋','淀粉','葱','蒜'],desc:'【酸甜爆汁】鸡蛋煎至两面金黄盛出。54321糖醋汁：5勺水+4勺番茄酱+3勺糖+2勺醋+1勺淀粉+少许盐。锅中炒香葱蒜，倒料汁烧开至浓稠，放鸡蛋翻匀裹汁，撒葱花白芝麻。' },

  // === 国民家常 TOP 10 ===
  { id:'m6',name:'西红柿炒鸡蛋',icon:'🍅🥚',tag:'国民第一',ingredients:['西红柿','鸡蛋','葱','糖','盐'],desc:'【家家会做】鸡蛋加少许盐和水打散，热油炒熟盛出。西红柿切块，炒至软烂出汁，加一勺糖提鲜，倒回鸡蛋翻匀，撒葱花出锅。拌饭拌面都绝。' },
  { id:'m7',name:'辣椒炒肉',icon:'🌶️🥩',tag:'湘菜之魂',ingredients:['猪肉','青椒','豆豉','蒜','生抽','老抽'],desc:'【湖南名菜】五花肉切薄片，青椒斜切。干锅煸青椒至起虎皮盛出。煸五花肉出油至微焦，加豆豉蒜片爆香，生抽老抽调味，倒回青椒大火快翻。' },
  { id:'m8',name:'麻婆豆腐',icon:'🧈🌶️',tag:'川味经典',ingredients:['豆腐','猪肉末','豆瓣酱','花椒粉','蒜','生抽'],desc:'【麻辣鲜香】豆腐切2cm块，盐水焯烫2分钟。炒肉末至干香，加豆瓣酱炒出红油，加蒜末+水烧开。轻放豆腐小火煮5分钟入味，水淀粉勾芡，撒花椒粉葱花。' },
  { id:'m9',name:'鱼香肉丝',icon:'🥩🥕',tag:'下饭之王',ingredients:['猪肉','胡萝卜','木耳','青椒','豆瓣酱','糖','醋','生抽','淀粉'],desc:'【酸甜微辣】肉丝+盐+葱姜水+淀粉上浆，封油。热油滑炒至变色盛出。炒豆瓣酱出红油，加胡萝卜木耳青椒丝翻炒，倒回肉丝。鱼香汁：2勺生抽+2勺醋+1勺糖+1勺淀粉+3勺水，淋入大火收汁。' },
  { id:'m10',name:'红烧肉',icon:'🍖',tag:'硬菜担当',ingredients:['五花肉','冰糖','八角','桂皮','香叶','生抽','老抽','料酒'],desc:'【软糯不腻】五花肉切3cm块，冷水下锅+料酒焯水捞出。小火炒冰糖至焦糖色起泡，下肉块裹匀。加开水没过肉，八角桂皮香叶+生抽老抽，小火炖1h。大火收汁至浓稠挂筷。' },
  { id:'m11',name:'可乐鸡翅',icon:'🍗🥤',tag:'孩子最爱',ingredients:['鸡翅','可乐','生抽','老抽','姜','料酒'],desc:'【零失败】鸡翅划两刀，冷水+姜+料酒焯水。热油煎至两面金黄，倒可乐没过鸡翅（约300ml）+2勺生抽+1勺老抽。大火烧开转中火15分钟，收汁时不停翻动防止粘锅。' },
  { id:'m12',name:'宫保鸡丁',icon:'🐔🥜',tag:'宴客必备',ingredients:['鸡胸肉','花生米','黄瓜','胡萝卜','干辣椒','花椒','生抽','醋','糖','淀粉'],desc:'【酸甜荔枝味】鸡胸肉切丁+盐+料酒+淀粉上浆。花生小火炒至微黄。调汁：2勺生抽+2勺醋+2勺糖+1勺淀粉+3勺水。热油滑鸡丁至白盛出。干辣椒花椒爆香，加胡萝卜黄瓜丁，倒鸡丁+汁大火翻，撒花生。' },
  { id:'m13',name:'清蒸鲈鱼',icon:'🐟',tag:'鲜美至极',ingredients:['鲈鱼','姜','葱','蒸鱼豉油','料酒'],desc:'【饭店级】鱼身划三刀，塞姜片，淋料酒。水开上锅大火蒸8分钟（1斤鱼），关火虚蒸2分钟。倒掉蒸出的腥汤！铺新鲜葱丝，先淋一勺热油激香，再沿盘边淋蒸鱼豉油。' },
  { id:'m14',name:'酸辣土豆丝',icon:'🥔🌶️',tag:'下饭神器',ingredients:['土豆','青椒','干辣椒','花椒','醋','盐'],desc:'【脆爽关键】土豆切细丝（越细越好），泡水洗去淀粉沥干。水中加1勺醋焯土豆丝30秒。热油爆干辣椒花椒，大火快炒土豆丝青椒丝30秒，加盐+锅边醋翻匀出锅。全程不超过1分钟。' },
  { id:'m15',name:'蒜蓉西兰花',icon:'🥦🧄',tag:'减脂必备',ingredients:['西兰花','蒜','蚝油','盐'],desc:'【翠绿秘诀】西兰花掰小朵，盐水泡10分钟。水开+盐+几滴油，焯水1分钟捞出过凉水（保脆保绿）。热油小火炒蒜末至金黄，加蚝油+少许水调汁，淋在摆好盘的西兰花上。' },

  // === 抖音热门快手菜 ===
  { id:'m16',name:'孜然火腿土豆丁',icon:'🥔🍖',tag:'夜市同款',ingredients:['土豆','火腿肠','孜然粉','辣椒面','白芝麻','盐'],desc:'【秒杀路边摊】土豆切1cm小丁，油热中小火煎至八面金黄焦脆。火腿肠切丁入锅炒香。撒孜然粉+辣椒面+白芝麻+盐，大火翻炒30秒，香气扑鼻出锅。' },
  { id:'m17',name:'红烧茄子',icon:'🍆',tag:'米饭杀手',ingredients:['茄子','淀粉','蒜','青红椒','生抽','蚝油','糖'],desc:'【不油腻版】茄子切滚刀块，洒水裹玉米淀粉，六成油温炸至金黄酥脆。调汁：生抽2+蚝油1+糖1+盐少许+淀粉1+清水4。少油炒蒜末，倒汁熬浓，加茄子青红椒翻匀。' },
  { id:'m18',name:'香辣肉末粉条',icon:'🍝🌶️',tag:'嗦粉狂魔',ingredients:['粉条','猪肉末','豆瓣酱','蒜','生抽','老抽'],desc:'【蚂蚁上树】粉条温水泡软20分钟剪段。热油炒肉末至干香酥脆，加豆瓣酱炒出红油，加蒜末。加开水+生抽老抽，放粉条中小火焖3-5分钟。大火收汁，撒葱花出锅。' },
  { id:'m19',name:'干锅碎碎虾',icon:'🦐🔥',tag:'干锅控',ingredients:['虾','蒜','小米辣','豆瓣酱','洋葱','芹菜'],desc:'【麻辣鲜香】大虾开背去线剪成三段。热油煸虾至外壳酥脆盛出。炒香蒜末小米辣+豆瓣酱出红油，加洋葱丝芹菜段翻炒，倒回虾段大火翻炒，撒芝麻出锅。' },
  { id:'m20',name:'黄瓜火腿炒鸡蛋',icon:'🥒🍖🥚',tag:'3分钟菜',ingredients:['黄瓜','火腿肠','鸡蛋','蒜','盐'],desc:'【懒人必会】黄瓜切菱形片，火腿肠切片。鸡蛋打散炒熟盛出。炒香蒜末，加火腿片煎至微焦，加黄瓜片大火快炒30秒，倒回鸡蛋，盐调味翻匀出锅。' },
  { id:'m21',name:'清炒四季豆',icon:'🫘',tag:'素菜经典',ingredients:['四季豆','蒜','干辣椒','盐'],desc:'【翠绿脆嫩】四季豆斜切段（更入味）。水开+盐+几滴油，焯水2分钟（必须焯透去毒素）。热油爆蒜末干辣椒，大火快炒四季豆，盐调味翻匀出锅。' },
  { id:'m22',name:'金钱蛋',icon:'🥚🪙',tag:'湖南名菜',ingredients:['鸡蛋','蒜苔','蒜','小米辣','生抽','老抽','蚝油','胡椒粉'],desc:'【焦香四溢】鸡蛋蒸熟剥壳，用细线切开（不用刀防散）。七成油温炸至两面金黄起皱。炒香蒜末小米辣+蒜苔粒，倒鸡蛋，加生抽+老抽+蚝油+胡椒粉大火爆炒出锅。' },
  { id:'m23',name:'鱼香茄子',icon:'🍆🌶️',tag:'不油腻',ingredients:['茄子','豆瓣酱','姜','蒜','糖','醋','生抽','淀粉'],desc:'【不吸油秘诀】茄子切条+盐腌15分钟，挤干水分洗净。少油炒姜蒜+豆瓣酱出红油，放茄子+鱼香汁(糖1+醋1+生抽2+水3+淀粉1)，中小火焖5分钟，放青红椒大火收汁。' },
  { id:'m24',name:'青椒爆蛋',icon:'🫑🥚',tag:'快手传承',ingredients:['青椒','鸡蛋','盐','白醋'],desc:'【外婆的味道】青椒干锅煸至起虎皮出香味切碎。鸡蛋+盐+几滴白醋打散，拌入青椒碎。热油倒入蛋液，煎至底部定型后翻炒成大块，表面微焦最香。' },
  { id:'m25',name:'白灼西兰花',icon:'🥦',tag:'减脂王牌',ingredients:['西兰花','蒜','蒸鱼豉油','蚝油'],desc:'【鲜甜脆嫩】西兰花掰小朵盐水泡洗。水开+盐+油，焯水90秒捞出立刻过冰水。摆盘，蒜末用热油激香，加蒸鱼豉油+蚝油调汁淋上。低卡高纤维！' },

  // === 硬菜系列 ===
  { id:'m26',name:'香辣大虾',icon:'🦐🌶️',tag:'宴客硬菜',ingredients:['虾','干辣椒','花椒','蒜','姜','豆瓣酱','生抽'],desc:'【麻辣过瘾】大虾开背去虾线，加料酒姜腌制。热油煎虾至壳酥盛出。小火炒香干辣椒+花椒+姜蒜+豆瓣酱出红油，倒回虾+生抽大火翻炒，撒白芝麻葱花。' },
  { id:'m27',name:'素炒平菇',icon:'🍄',tag:'比肉还香',ingredients:['平菇','蒜','青椒','生抽','蚝油'],desc:'【鲜嫩多汁】平菇撕小条，热水焯30秒挤干。热油炒蒜末，放平菇大火翻炒至边缘微焦，加青椒丝+生抽+蚝油翻炒出锅。口感像肉一样！' },
  { id:'m28',name:'菠菜淋汁',icon:'🌿',tag:'补铁好菜',ingredients:['菠菜','蒜','生抽','蚝油','芝麻'],desc:'【爽口营养】菠菜洗净不去根（根最甜）。水开+盐+油，焯水30秒捞出过凉挤干。摆盘，蒜末+生抽+蚝油+少许水煮开淋上，撒白芝麻。' },
  { id:'m29',name:'香干炒豆芽',icon:'🫓🌱',tag:'5元硬菜',ingredients:['豆芽','香干','韭菜','蒜','生抽'],desc:'【成本不到5块】香干切条。热油爆蒜，放豆芽大火炒至断生，加香干翻炒，生抽调味，最后放韭菜段快翻10秒出锅。从备菜到出锅5分钟。' },
  { id:'m30',name:'排骨炖冬瓜',icon:'🍖🍈',tag:'滋补靓汤',ingredients:['排骨','冬瓜','姜','枸杞','盐','料酒'],desc:'【汤白味浓】排骨冷水下锅+料酒姜片焯水，温水洗净。开水下排骨+姜片，大火滚10分钟转小火炖40分钟。冬瓜去皮切块，下锅再炖15分钟，加枸杞+盐调味。' },
  { id:'m31',name:'葱烧木耳',icon:'🧅🪵',tag:'下饭神菜',ingredients:['木耳','大葱','生抽','蚝油','糖','淀粉'],desc:'【素菜吃出肉味】木耳冷水泡发3小时撕小朵。大葱切斜段。热油小火煸葱段至焦黄出香，放木耳大火翻炒，生抽+蚝油+少许糖调味，水淀粉勾薄芡出锅。' },
  { id:'m32',name:'炒莲藕',icon:'🪷',tag:'脆爽清甜',ingredients:['莲藕','青红椒','白醋','糖','盐'],desc:'【雪白不黑】莲藕去皮切薄片，立刻泡入加白醋的水中。水开+白醋焯藕片1分钟，捞出过凉。热油爆姜丝，下藕片大火快炒，加糖+盐+白醋，青红椒配色。全程不加水！' },
  { id:'m33',name:'黄焖牛肉',icon:'🐂🍲',tag:'软烂入味',ingredients:['牛肉','土豆','胡萝卜','八角','桂皮','生抽','老抽','黄豆酱'],desc:'【软烂秘诀】牛腩切块，冷水泡30分钟去血水（不焯水保持肉香）。炒糖色+牛肉煸至微焦，加开水！+八角桂皮+黄豆酱+生抽老抽，小火炖1.5h。加土豆胡萝卜再炖20分钟大火收汁。' },
  { id:'m34',name:'清炒西葫芦',icon:'🥒',tag:'不出水秘诀',ingredients:['西葫芦','蒜','干辣椒','盐'],desc:'【脆嫩不出水】西葫芦去瓤（瓤会出水），切半月片。加少许盐腌10分钟挤干水。热油爆蒜干辣椒，大火快炒1分钟，加少许生抽翻匀出锅。全程大火！' },

  // === 经典名菜 ===
  { id:'m35',name:'水煮肉片',icon:'🥩🌶️🔥',tag:'川菜经典',ingredients:['猪肉','豆芽','干辣椒','花椒','豆瓣酱','蒜','生抽','淀粉'],desc:'【麻辣鲜嫩】猪里脊切薄片+盐+料酒+蛋清+淀粉上浆。干辣椒花椒小火炒香切碎(刀口辣椒)。炒豆瓣酱出红油+水烧开，豆芽焯水铺碗底。肉片一片片滑入锅中，变色即捞出铺豆芽上。撒蒜末+刀口辣椒，浇滚烫热油。' },
  { id:'m36',name:'回锅肉',icon:'🥩🫑',tag:'川菜之首',ingredients:['五花肉','蒜苗','豆瓣酱','豆豉','青椒','姜','生抽'],desc:'【肥而不腻】五花肉整块冷水+姜+料酒煮20分钟，筷子能扎透捞出，切薄片。干锅煸青椒至虎皮。少油煸肉片至卷曲出油(灯盏窝)，加豆瓣酱+豆豉炒出红油，加青椒蒜苗生抽大火翻。' },
  { id:'m37',name:'地三鲜',icon:'🥔🍆🫑',tag:'东北名菜',ingredients:['土豆','茄子','青椒','蒜','生抽','糖','淀粉'],desc:'【东北扛把子】土豆切滚刀块，茄子切滚刀块裹淀粉，青椒切块。分别油炸：土豆炸金黄、茄子炸焦脆、青椒炸10秒。少油炒蒜，加生抽+糖+水+淀粉熬汁，倒三样快翻出锅。' },

  { id:'m41',name:'蒜蓉粉丝蒸虾',icon:'🦐🧄',tag:'宴客必备',ingredients:['虾','粉丝','蒜','小米辣','蒸鱼豉油','蚝油','葱'],desc:'【饭店级颜值】粉丝温水泡软铺盘底。大虾开背去线，码在粉丝上。蒜末+小米辣+蚝油+蒸鱼豉油调成蒜蓉酱，铺虾身上。水开上锅大火蒸6分钟，出锅撒葱花，淋滚热油激香。' },
  { id:'m42',name:'红烧排骨',icon:'🍖🔥',tag:'家常硬菜',ingredients:['排骨','冰糖','八角','桂皮','生抽','老抽','料酒','姜'],desc:'【酱香浓郁】排骨冷水+料酒+姜焯水，温水洗净。小火炒冰糖至焦糖色，下排骨翻炒上色。加开水没过排骨，八角+桂皮+生抽+老抽，大火烧开转小火炖40分钟。加盐，大火收汁至浓稠。' },
  { id:'m43',name:'京酱肉丝',icon:'🥩🧅',tag:'北京名菜',ingredients:['猪里脊','大葱','甜面酱','糖','生抽','淀粉','豆腐皮'],desc:'【宴客有面子】里脊切细丝+盐+料酒+蛋清+淀粉上浆。大葱切细丝铺盘底。热油滑炒肉丝至白盛出。小火炒甜面酱+糖+生抽+少许水，倒肉丝大火翻匀，铺在葱丝上。豆腐皮切方块围边，卷着吃。' },
  { id:'m44',name:'锅包肉',icon:'🥩🫙',tag:'东北硬菜',ingredients:['猪里脊','土豆淀粉','白醋','糖','胡萝卜','姜','葱'],desc:'【酥脆酸甜】里脊切厚片拍松。土豆淀粉+水沉淀，倒掉水用湿淀粉抓肉。糖醋汁：糖3+白醋3+少许生抽搅匀。六成油温一片片下肉炸定型捞出，七成复炸至金黄酥脆。少油炒姜丝胡萝卜丝+糖醋汁熬浓，倒肉片快翻出锅，趁热吃最脆！' },

  // === 暖心汤羹 ===
  { id:'m45',name:'白菜豆腐汤',icon:'🥬🧈',tag:'暖心暖胃',ingredients:['大白菜','豆腐','姜','枸杞','盐'],desc:'【清淡鲜美】白菜手撕大片（不用刀更有口感）。豆腐切2cm块。清水+姜片烧开，放白菜煮软，加豆腐小火煮5分钟。加盐+枸杞，淋几滴香油出锅。食材原味最动人。' },
  { id:'m46',name:'冬瓜排骨汤',icon:'🍈🍖',tag:'夏季必喝',ingredients:['排骨','冬瓜','薏米','姜','盐','枸杞'],desc:'【清热祛湿】排骨焯水洗净。薏米提前泡2小时。排骨+薏米+姜片+足量开水，大火10分钟转小火炖1小时。冬瓜去皮切大块（大块不易烂），加冬瓜再炖20分钟，盐+枸杞调味。' },
  { id:'m47',name:'番茄菌菇汤',icon:'🍅🍄',tag:'低卡饱腹',ingredients:['西红柿','金针菇','香菇','豆腐','鸡蛋','盐'],desc:'【酸甜鲜美】西红柿切块炒出汁，加开水烧开。放金针菇+香菇片+豆腐块，煮5分钟。淋入打散的蛋液，关火静置30秒让蛋花成型。盐+白胡椒粉调味，撒葱花。' },

  // === 凉菜系列 ===
  { id:'m48',name:'凉拌黄瓜',icon:'🥒',tag:'开胃凉菜',ingredients:['黄瓜','蒜','醋','生抽','辣椒油','糖','芝麻'],desc:'【拍黄瓜秘诀】黄瓜装保鲜袋中用刀背拍裂（汁不溅），取出切段。酱汁：蒜末+生抽2+醋2+糖半勺+辣椒油1+芝麻。淋汁拌匀，冷藏10分钟更脆爽入味！' },
  { id:'m49',name:'凉拌木耳',icon:'🪵🌶️',tag:'爽口小菜',ingredients:['木耳','蒜','香菜','醋','生抽','辣椒油','糖'],desc:'【脆弹开胃】木耳冷水泡发3小时洗净焯水2分钟。过冰水沥干。酱汁：蒜末+生抽2+陈醋2+糖1+辣椒油+香油。拌匀冷藏15分钟，上桌前撒香菜。' },
  { id:'m50',name:'韭菜炒鸡蛋',icon:'🌾🥚',tag:'春天必吃',ingredients:['韭菜','鸡蛋','盐'],desc:'【春天的味道】韭菜切3cm段，梗和叶分开放。鸡蛋+盐打散，热油炒熟盛出。大火先炒韭菜梗10秒，加韭菜叶炒5秒，倒回鸡蛋翻匀出锅。全程不超过30秒，过火就老了！' },
];

// ============ STATE ============
let cart = {};
let activeCat = 'leaf';
let currentTab = 'shop';

// ============ RENDER ============
function renderCatTabs() {
  const container = document.getElementById('catTabs');
  container.innerHTML = categories.map(c =>
    `<div class="cat-tab ${c.id === activeCat ? 'active' : ''}" onclick="setCategory('${c.id}')">${c.name}</div>`
  ).join('');
}

function renderVegGrid() {
  const container = document.getElementById('vegGrid');
  const items = vegetables.filter(v => v.cat === activeCat);
  container.innerHTML = items.map(v => {
    const qty = cart[v.id] || 0;
    return `
      <div class="veg-card" onclick="addToCart('${v.id}')">
        ${qty > 0 ? `<div class="veg-qty">${qty}</div>` : ''}
        <span class="veg-emoji">${v.emoji}</span>
        <div class="veg-name">${v.name}</div>
        <div class="veg-price">¥${v.price.toFixed(1)}/份</div>
        <div class="veg-add">+</div>
      </div>`;
  }).join('');
}

function renderMenuList() {
  const container = document.getElementById('menuList');
  const searchText = (document.getElementById('menuSearchInput').value || '').trim().toLowerCase();
  const filtered = menus.filter(m => {
    if (!searchText) return true;
    return m.name.includes(searchText) || m.tag.includes(searchText) ||
           m.ingredients.some(i => i.includes(searchText)) || m.desc.includes(searchText);
  });
  container.innerHTML = filtered.map((m, idx) => `
    <div class="menu-card" style="animation: fadePage 0.3s ${idx*0.03}s both">
      <div class="menu-header">
        <span class="menu-icon">${m.icon}</span>
        <span class="menu-title">${m.name}</span>
        <span class="menu-tag">${m.tag}</span>
      </div>
      <div class="menu-ingredients">
        ${m.ingredients.map(i => `<span class="menu-ingredient">${i}</span>`).join('')}
      </div>
      <div class="menu-desc menu-desc-full">${m.desc}</div>
      <button class="menu-add-all" onclick="event.stopPropagation(); addMenuIngredients('${m.id}')">
        📋 一键加入购物车
      </button>
    </div>
  `).join('');
}

function renderCart() {
  const container = document.getElementById('cartList');
  const footer = document.getElementById('cartFooter');
  const empty = document.getElementById('cartEmpty');
  const items = Object.entries(cart).filter(([,q]) => q > 0);

  if (items.length === 0) {
    container.innerHTML = '';
    footer.style.display = 'none';
    empty.style.display = 'block';
  } else {
    empty.style.display = 'none';
    footer.style.display = 'flex';
    container.innerHTML = items.map(([id, qty]) => {
      const v = vegetables.find(veg => veg.id === id);
      if (!v) return '';
      return `
        <div class="cart-item">
          <span class="cart-item-emoji">${v.emoji}</span>
          <div class="cart-item-info">
            <div class="cart-item-name">${v.name}</div>
            <div class="cart-item-price">¥${v.price.toFixed(1)} × ${qty} = ¥${(v.price * qty).toFixed(1)}</div>
          </div>
          <div class="cart-qty-wrap">
            <button class="cart-qty-btn" onclick="decreaseQty('${id}')">−</button>
            <span class="cart-qty-num">${qty}</span>
            <button class="cart-qty-btn" onclick="addToCart('${id}')">+</button>
          </div>
          <span class="cart-item-del" onclick="removeItem('${id}')">✕</span>
        </div>`;
    }).join('');

    const total = items.reduce((sum, [id, qty]) => {
      const v = vegetables.find(veg => veg.id === id);
      return sum + (v ? v.price * qty : 0);
    }, 0);
    document.getElementById('cartTotalPrice').textContent = '¥' + total.toFixed(1);
  }
}

function updateBadges() {
  const total = Object.values(cart).reduce((a, b) => a + b, 0);
  const badge = document.getElementById('cartBadge');
  const navBadge = document.getElementById('navCartBadge');

  badge.textContent = total;
  if (total > 0) {
    badge.classList.add('pop');
    setTimeout(() => badge.classList.remove('pop'), 400);
    navBadge.style.display = 'flex';
    navBadge.textContent = total;
  } else {
    navBadge.style.display = 'none';
  }
}

// ============ ACTIONS ============
function setCategory(catId) {
  activeCat = catId;
  renderCatTabs();
  renderVegGrid();
}

function addToCart(vegId) {
  cart[vegId] = (cart[vegId] || 0) + 1;
  renderVegGrid();
  updateBadges();
  if (currentTab === 'cart') renderCart();
}

function decreaseQty(vegId) {
  if (cart[vegId] > 1) {
    cart[vegId]--;
  } else {
    delete cart[vegId];
  }
  renderVegGrid();
  renderCart();
  updateBadges();
}

function removeItem(vegId) {
  delete cart[vegId];
  renderVegGrid();
  renderCart();
  updateBadges();
}

function clearCart() {
  cart = {};
  renderVegGrid();
  renderCart();
  updateBadges();
}

function addMenuIngredients(menuId) {
  const menu = menus.find(m => m.id === menuId);
  if (!menu) return;
  menu.ingredients.forEach(name => {
    const v = vegetables.find(veg => veg.name === name);
    if (v) {
      cart[v.id] = (cart[v.id] || 0) + 1;
    }
  });
  renderVegGrid();
  updateBadges();
  // bounce effect
  const badge = document.getElementById('cartBadge');
  badge.classList.add('pop');
  setTimeout(() => badge.classList.remove('pop'), 400);
}

function switchTab(tab) {
  currentTab = tab;
  document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
  document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));

  document.getElementById('page-' + tab).classList.add('active');
  document.getElementById('nav-' + tab).classList.add('active');

  if (tab === 'cart') renderCart();
}
</script>

<script>
// ============ INIT ============
renderCatTabs();
renderVegGrid();
renderMenuList();
renderCart();
updateBadges();
</script>

</body>
</html>
