<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>菜篮子 — 今天吃什么？</title>
<style>
*, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

:root {
  --pink: #FF6B8A;
  --green: #5CB85C;
  --yellow: #FFB347;
  --orange: #FF7B42;
  --blue: #5BC0DE;
  --purple: #B07CD8;
  --bg: #FFF8F0;
  --card: #FFFFFF;
  --text: #4A3728;
  --sub: #8B7355;
  --border: #E8D5C4;
}

body {
  font-family: "PingFang SC", "Microsoft YaHei", "Noto Sans SC", sans-serif;
  background: var(--bg);
  color: var(--text);
  min-height: 100vh;
  padding-bottom: 80px;
  -webkit-font-smoothing: antialiased;
  background-image:
    radial-gradient(circle at 10% 20%, rgba(255,179,71,0.08) 0%, transparent 50%),
    radial-gradient(circle at 90% 80%, rgba(255,107,138,0.06) 0%, transparent 50%),
    radial-gradient(circle at 50% 50%, rgba(91,192,222,0.05) 0%, transparent 50%);
}

/* ============ HEADER ============ */
.header {
  background: linear-gradient(135deg, #FF7B42, #FF6B8A, #FFB347);
  background-size: 200% 200%;
  animation: headerShimmer 8s ease-in-out infinite;
  padding: 20px 16px 24px;
  text-align: center;
  color: #fff;
  position: sticky;
  top: 0;
  z-index: 50;
  box-shadow: 0 4px 20px rgba(255,107,138,0.25);
  border-radius: 0 0 28px 28px;
}

@keyframes headerShimmer {
  0%, 100% { background-position: 0% 50%; }
  50% { background-position: 100% 50%; }
}

.header h1 {
  font-size: 1.6rem;
  letter-spacing: 0.04em;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
}

.header h1 .bounce {
  display: inline-block;
  animation: vegBounce 1s ease-in-out infinite;
}
.header h1 .bounce:nth-child(2) { animation-delay: 0.15s; }
.header h1 .bounce:nth-child(3) { animation-delay: 0.3s; }

@keyframes vegBounce {
  0%, 100% { transform: translateY(0); }
  50% { transform: translateY(-6px); }
}

.cart-badge {
  position: fixed;
  top: 14px;
  right: 16px;
  z-index: 60;
  background: #fff;
  color: var(--pink);
  width: 36px;
  height: 36px;
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  font-weight: 700;
  font-size: 0.85rem;
  box-shadow: 0 3px 12px rgba(0,0,0,0.15);
  transition: transform 0.2s;
  cursor: pointer;
}

.cart-badge.pop { animation: popBadge 0.4s ease-out; }
@keyframes popBadge {
  0% { transform: scale(1); }
  50% { transform: scale(1.4); }
  100% { transform: scale(1); }
}

/* ============ CATEGORY TABS (shop page) ============ */
.cat-tabs {
  display: flex;
  gap: 8px;
  padding: 14px 16px 8px;
  overflow-x: auto;
  scrollbar-width: none;
  -ms-overflow-style: none;
  flex-wrap: nowrap;
}
.cat-tabs::-webkit-scrollbar { display: none; }

.cat-tab {
  flex-shrink: 0;
  padding: 8px 18px;
  border-radius: 20px;
  border: 2px solid var(--border);
  background: #fff;
  font-size: 0.82rem;
  font-weight: 600;
  color: var(--sub);
  cursor: pointer;
  transition: all 0.25s;
  white-space: nowrap;
}
.cat-tab.active {
  background: var(--green);
  color: #fff;
  border-color: var(--green);
  box-shadow: 0 3px 12px rgba(92,184,92,0.25);
  transform: translateY(-2px);
}

/* ============ VEG GRID ============ */
.veg-grid {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 12px;
  padding: 12px 16px 20px;
}

.veg-card {
  background: #fff;
  border-radius: 18px;
  padding: 16px 10px 14px;
  text-align: center;
  border: 2px solid #F5EDE5;
  cursor: pointer;
  transition: all 0.25s cubic-bezier(0.18, 0.89, 0.32, 1.28);
  position: relative;
  overflow: hidden;
}
.veg-card:hover {
  transform: translateY(-4px);
  box-shadow: 0 8px 24px rgba(0,0,0,0.08);
  border-color: var(--green);
}
.veg-card:active { transform: scale(0.95); }

.veg-emoji {
  font-size: 2.8rem;
  display: block;
  margin-bottom: 6px;
  animation: floatItem 3s ease-in-out infinite;
}
.veg-card:nth-child(odd) .veg-emoji { animation-delay: 0s; }
.veg-card:nth-child(even) .veg-emoji { animation-delay: 0.5s; }

@keyframes floatItem {
  0%, 100% { transform: translateY(0) rotate(0deg); }
  25% { transform: translateY(-4px) rotate(-3deg); }
  75% { transform: translateY(-2px) rotate(3deg); }
}

.veg-name { font-size: 0.85rem; font-weight: 700; color: var(--text); margin-bottom: 4px; }
.veg-price { font-size: 0.72rem; color: var(--orange); font-weight: 600; }

.veg-add {
  display: inline-block;
  width: 32px; height: 32px;
  border-radius: 50%;
  background: var(--green);
  color: #fff;
  font-size: 1.2rem;
  line-height: 32px;
  margin-top: 6px;
  border: none;
  cursor: pointer;
  transition: all 0.2s;
  box-shadow: 0 3px 8px rgba(92,184,92,0.3);
}
.veg-add:hover { background: #4CA84C; transform: scale(1.1); }
.veg-add:active { transform: scale(0.9); }

.veg-qty {
  position: absolute;
  top: 6px; right: 8px;
  background: var(--pink);
  color: #fff;
  min-width: 22px; height: 22px;
  padding: 0 5px;
  border-radius: 11px;
  font-size: 0.7rem;
  font-weight: 700;
  display: flex;
  align-items: center;
  justify-content: center;
  animation: popBadge 0.3s;
}

/* ============ MENU SECTION (主界面) ============ */
.menu-hero {
  background: linear-gradient(135deg, #FFF5EE, #FFF0E6, #FFE8D6);
  margin: 14px 16px 0;
  border-radius: 22px;
  padding: 22px 20px;
  border: 2px solid #FFD6B8;
  position: relative;
  overflow: hidden;
  animation: heroGlow 3s ease-in-out infinite;
}
@keyframes heroGlow {
  0%, 100% { box-shadow: 0 0 20px rgba(255,123,66,0.1); }
  50% { box-shadow: 0 0 40px rgba(255,123,66,0.2); }
}
.menu-hero::after {
  content: '';
  position: absolute;
  top: -50px; right: -50px;
  width: 150px; height: 150px;
  border-radius: 50%;
  background: rgba(255,179,71,0.12);
  pointer-events: none;
}
.menu-hero-content {
  display: flex;
  align-items: center;
  gap: 16px;
  position: relative;
  z-index: 1;
}
.menu-hero-emoji {
  font-size: 3.2rem;
  animation: heroBounce 2s ease-in-out infinite;
}
@keyframes heroBounce {
  0%, 100% { transform: translateY(0) rotate(0); }
  25% { transform: translateY(-8px) rotate(-5deg); }
  75% { transform: translateY(-4px) rotate(5deg); }
}
.menu-hero-title {
  font-size: 1.35rem;
  font-weight: 800;
  color: var(--text);
}
.menu-hero-sub {
  font-size: 0.78rem;
  color: var(--sub);
  margin-top: 4px;
}

/* random pick button */
.random-btn {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  width: 100%;
  margin-top: 16px;
  padding: 12px;
  border-radius: 16px;
  border: 2px dashed #FFB88C;
  background: #fff;
  color: var(--orange);
  font-size: 0.9rem;
  font-weight: 700;
  cursor: pointer;
  transition: all 0.25s;
  position: relative;
  z-index: 1;
}
.random-btn:hover {
  background: var(--orange);
  color: #fff;
  border-color: var(--orange);
  box-shadow: 0 4px 16px rgba(255,123,66,0.3);
  transform: translateY(-2px);
}
.random-btn:active { transform: scale(0.96); }
.random-btn-icon { font-size: 1.2rem; }

/* random overlay */
.random-overlay {
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.5);
  z-index: 100;
  display: flex;
  align-items: center;
  justify-content: center;
  animation: fadeOverlay 0.2s;
  backdrop-filter: blur(4px);
}
@keyframes fadeOverlay { from { opacity: 0; } to { opacity: 1; } }

.random-modal {
  background: #fff;
  border-radius: 24px;
  padding: 28px 22px 22px;
  width: 90vw;
  max-width: 400px;
  position: relative;
  text-align: center;
  animation: modalPop 0.35s cubic-bezier(0.18, 0.89, 0.32, 1.28);
  max-height: 85vh;
  overflow-y: auto;
}
@keyframes modalPop {
  from { transform: scale(0.8) translateY(20px); opacity: 0; }
  to { transform: scale(1) translateY(0); opacity: 1; }
}

.random-close {
  position: absolute;
  top: 12px;
  right: 14px;
  width: 32px;
  height: 32px;
  border-radius: 50%;
  border: none;
  background: #F5EDE5;
  color: var(--sub);
  font-size: 1rem;
  cursor: pointer;
  transition: all 0.15s;
  display: flex;
  align-items: center;
  justify-content: center;
}
.random-close:hover { background: var(--pink); color: #fff; }

/* spin stage */
.random-spin-stage { padding: 20px 0; }

.random-spin-icon {
  font-size: 5rem;
  animation: spinSlot 0.08s linear infinite;
  margin-bottom: 16px;
}
@keyframes spinSlot {
  0% { transform: scale(1) rotate(0deg); }
  25% { transform: scale(1.1) rotate(90deg); }
  50% { transform: scale(1) rotate(180deg); }
  75% { transform: scale(1.1) rotate(270deg); }
  100% { transform: scale(1) rotate(360deg); }
}

.random-spin-name {
  font-size: 1.1rem;
  font-weight: 700;
  color: var(--text);
  min-height: 28px;
  animation: textBlur 0.08s steps(1) infinite;
}
@keyframes textBlur {
  0%, 100% { opacity: 1; }
  50% { opacity: 0.4; }
}

/* result stage */
.random-result-icon {
  font-size: 4.5rem;
  margin-bottom: 8px;
  animation: resultBounce 0.5s ease-out;
}
@keyframes resultBounce {
  0% { transform: scale(0); }
  60% { transform: scale(1.2); }
  100% { transform: scale(1); }
}

.random-result-title {
  font-size: 1.3rem;
  font-weight: 800;
  color: var(--text);
  margin-bottom: 6px;
}

.random-result-tag {
  display: inline-block;
  font-size: 0.7rem;
  padding: 3px 12px;
  border-radius: 12px;
  font-weight: 700;
  margin-bottom: 12px;
}

.random-result-ingredients {
  display: flex;
  flex-wrap: wrap;
  gap: 6px;
  justify-content: center;
  margin-bottom: 14px;
}

.random-result-ingredient {
  font-size: 0.72rem;
  padding: 4px 12px;
  border-radius: 14px;
  background: #F0F9F0;
  color: var(--green);
  font-weight: 600;
}

.random-result-desc {
  font-size: 0.8rem;
  color: var(--sub);
  line-height: 1.8;
  background: #FFFBF7;
  padding: 14px;
  border-radius: 14px;
  margin-bottom: 16px;
  text-align: left;
}

.random-result-actions {
  display: flex;
  gap: 10px;
}

.random-result-add {
  flex: 1;
  padding: 12px;
  border-radius: 16px;
  border: none;
  background: var(--green);
  color: #fff;
  font-weight: 700;
  font-size: 0.82rem;
  cursor: pointer;
  transition: all 0.2s;
}
.random-result-add:hover { background: #4CA84C; box-shadow: 0 4px 12px rgba(92,184,92,0.3); }
.random-result-add:active { transform: scale(0.95); }

.random-result-retry {
  flex: 1;
  padding: 12px;
  border-radius: 16px;
  border: 2px solid var(--orange);
  background: #fff;
  color: var(--orange);
  font-weight: 700;
  font-size: 0.82rem;
  cursor: pointer;
  transition: all 0.2s;
}
.random-result-retry:hover { background: var(--orange); color: #fff; }
.random-result-retry:active { transform: scale(0.95); }

/* random btn in result (added feedback) */
.random-result-add.added {
  background: #4CA84C;
  animation: popBadge 0.4s;
}

/* shop floating random button */
.shop-random-fab {
  position: fixed;
  bottom: 100px;
  right: 16px;
  z-index: 45;
  width: 50px;
  height: 50px;
  border-radius: 50%;
  border: 3px solid var(--orange);
  background: #fff;
  color: var(--orange);
  font-size: 1.4rem;
  cursor: pointer;
  box-shadow: 0 4px 18px rgba(255,123,66,0.3);
  transition: all 0.25s cubic-bezier(0.18, 0.89, 0.32, 1.28);
  display: flex;
  align-items: center;
  justify-content: center;
}
.shop-random-fab:hover {
  transform: scale(1.1);
  background: var(--orange);
  box-shadow: 0 6px 24px rgba(255,123,66,0.4);
}
.shop-random-fab:active { transform: scale(0.9); }

/* toast notification */
.random-toast {
  position: fixed;
  bottom: 130px;
  left: 50%;
  transform: translateX(-50%) translateY(20px);
  z-index: 46;
  background: var(--text);
  color: #fff;
  padding: 12px 22px;
  border-radius: 24px;
  font-size: 0.88rem;
  font-weight: 700;
  opacity: 0;
  pointer-events: none;
  transition: all 0.3s cubic-bezier(0.18, 0.89, 0.32, 1.28);
  white-space: nowrap;
  box-shadow: 0 6px 20px rgba(0,0,0,0.2);
}
.random-toast.show {
  opacity: 1;
  transform: translateX(-50%) translateY(0);
}

/* ============ CONFIRM MODAL (ingredient add) ============ */
.confirm-overlay {
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.5);
  z-index: 100;
  display: flex;
  align-items: center;
  justify-content: center;
  animation: fadeOverlay 0.2s;
  backdrop-filter: blur(4px);
}

.confirm-modal {
  background: #fff;
  border-radius: 24px;
  padding: 24px 20px 20px;
  width: 88vw;
  max-width: 380px;
  text-align: center;
  animation: modalPop 0.35s cubic-bezier(0.18, 0.89, 0.32, 1.28);
  max-height: 75vh;
  overflow-y: auto;
}

.confirm-icon { font-size: 3rem; margin-bottom: 8px; }

.confirm-title {
  font-size: 1rem;
  font-weight: 800;
  color: var(--text);
  margin-bottom: 4px;
  line-height: 1.5;
}

.confirm-list {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
  justify-content: center;
  margin: 14px 0;
}

.confirm-item {
  display: flex;
  align-items: center;
  gap: 5px;
  padding: 6px 12px;
  border-radius: 20px;
  background: #FFFBF5;
  border: 2px solid #F5EDE5;
  font-size: 0.76rem;
  font-weight: 600;
  color: var(--text);
}

.confirm-item.main { background: #FFF0E6; border-color: #FFD6B8; }
.confirm-item.side { background: #F0F9F0; border-color: #B8E6C8; }
.confirm-item.cond { background: #FFF5F5; border-color: #FFD0D0; }

.confirm-item-emoji { font-size: 1.1rem; }

.confirm-actions {
  display: flex;
  gap: 10px;
  margin-top: 16px;
}

.confirm-btn-yes {
  flex: 1;
  padding: 12px;
  border-radius: 16px;
  border: none;
  background: var(--green);
  color: #fff;
  font-weight: 700;
  font-size: 0.85rem;
  cursor: pointer;
  transition: all 0.2s;
}
.confirm-btn-yes:hover { background: #4CA84C; box-shadow: 0 4px 12px rgba(92,184,92,0.3); }
.confirm-btn-yes:active { transform: scale(0.95); }

.confirm-btn-no {
  flex: 1;
  padding: 12px;
  border-radius: 16px;
  border: 2px solid #E8D5C4;
  background: #fff;
  color: var(--sub);
  font-weight: 700;
  font-size: 0.85rem;
  cursor: pointer;
  transition: all 0.2s;
}
.confirm-btn-no:hover { background: #F5EDE5; }
.confirm-btn-no:active { transform: scale(0.95); }

/* ============ PAYMENT ============ */
.cart-footer-btns {
  display: flex;
  gap: 8px;
}

.cart-checkout {
  padding: 8px 18px;
  border-radius: 20px;
  border: none;
  background: linear-gradient(135deg, var(--orange), var(--pink));
  color: #fff;
  font-weight: 700;
  cursor: pointer;
  font-size: 0.82rem;
  transition: all 0.2s;
  white-space: nowrap;
}
.cart-checkout:hover {
  box-shadow: 0 4px 14px rgba(255,107,138,0.35);
  transform: translateY(-1px);
}
.cart-checkout:active { transform: scale(0.95); }

.pay-overlay {
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.45);
  z-index: 100;
  display: flex;
  align-items: flex-end;
  justify-content: center;
  animation: fadeOverlay 0.2s;
}

.pay-modal {
  background: #fff;
  border-radius: 24px 24px 0 0;
  width: 100%;
  max-width: 500px;
  max-height: 90vh;
  overflow-y: auto;
  animation: slideUp 0.3s cubic-bezier(0.18, 0.89, 0.32, 1.28);
}
@keyframes slideUp {
  from { transform: translateY(100%); }
  to { transform: translateY(0); }
}

.pay-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 16px 18px 12px;
  border-bottom: 1px solid #F5EDE5;
  position: sticky;
  top: 0;
  background: #fff;
  z-index: 2;
  border-radius: 24px 24px 0 0;
}
.pay-title { font-size: 1.05rem; font-weight: 800; }
.pay-back { width: 24px; height: 24px; display: flex; align-items: center; justify-content: center; cursor: pointer; font-size: 1.1rem; color: var(--sub); }

.pay-addr {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 12px 18px;
  background: #FFFBF5;
  border-bottom: 1px solid #F5EDE5;
  font-size: 0.82rem;
  font-weight: 600;
}
.pay-addr-icon { font-size: 1.2rem; }

.pay-items {
  padding: 8px 18px;
  max-height: 200px;
  overflow-y: auto;
}
.pay-item {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 10px 0;
  border-bottom: 1px solid #FAF5F0;
}
.pay-item:last-child { border-bottom: none; }
.pay-item-emoji { font-size: 1.5rem; }
.pay-item-info { flex: 1; }
.pay-item-name { font-weight: 700; font-size: 0.85rem; }
.pay-item-qty { font-size: 0.7rem; color: var(--sub); }
.pay-item-price { font-weight: 700; font-size: 0.85rem; color: var(--pink); }

.pay-summary {
  padding: 12px 18px;
  border-top: 1px solid #F5EDE5;
  background: #FFFBF7;
}
.pay-row {
  display: flex;
  justify-content: space-between;
  font-size: 0.8rem;
  color: var(--sub);
  padding: 4px 0;
}
.pay-total-row {
  font-size: 1rem;
  font-weight: 800;
  color: var(--text);
  padding-top: 8px;
  margin-top: 4px;
  border-top: 1px dashed #E8D5C4;
}
.pay-total-row span:last-child { color: var(--pink); font-size: 1.1rem; }

.pay-methods {
  padding: 12px 18px;
}
.pay-method-title {
  font-size: 0.8rem;
  font-weight: 700;
  color: var(--sub);
  margin-bottom: 10px;
}

.pay-method {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 14px 16px;
  border-radius: 14px;
  border: 2px solid #F0EDE5;
  margin-bottom: 8px;
  cursor: pointer;
  transition: all 0.2s;
  position: relative;
}
.pay-method input { display: none; }
.pay-method-icon { font-size: 1.4rem; }
.pay-method-name { font-weight: 700; font-size: 0.88rem; flex: 1; }
.pay-method-check {
  width: 20px; height: 20px;
  border-radius: 50%;
  border: 2px solid #DDD;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 0.65rem;
  color: transparent;
  transition: all 0.2s;
}
.pay-method.selected {
  border-color: var(--green);
  background: #F5FFF5;
}
.pay-method.selected .pay-method-check {
  border-color: var(--green);
  background: var(--green);
  color: #fff;
}

.pay-submit {
  display: block;
  width: calc(100% - 36px);
  margin: 0 18px 20px;
  padding: 14px;
  border-radius: 16px;
  border: none;
  background: linear-gradient(135deg, var(--green), #4CA84C);
  color: #fff;
  font-size: 1rem;
  font-weight: 800;
  cursor: pointer;
  transition: all 0.2s;
  box-shadow: 0 4px 16px rgba(92,184,92,0.3);
}
.pay-submit:hover { box-shadow: 0 6px 20px rgba(92,184,92,0.4); transform: translateY(-1px); }
.pay-submit:active { transform: scale(0.97); }

/* processing */
.pay-processing {
  text-align: center;
  padding: 50px 20px;
}
.pay-spinner {
  width: 48px; height: 48px;
  border: 4px solid #F0EDE5;
  border-top-color: var(--green);
  border-radius: 50%;
  animation: spin 0.8s linear infinite;
  margin: 0 auto 16px;
}
@keyframes spin { to { transform: rotate(360deg); } }

  { id:'m4',name:'蒜香鱼片',icon:'🐟🧄',cat:'trending',ingredients:['鱼片','蒜','蛋清','淀粉','小米辣','生抽','蚝油'],desc:'鱼片洗净挤干→盐+胡椒粉抓匀→蛋清+淀粉上浆→封油腌10min。水微开转小火，鱼片滑入烫25秒捞出。热油炒蒜末小米辣+生抽蚝油，倒鱼片大火快翻，撒葱花。' },
  { id:'m5',name:'糖醋荷包蛋',icon:'🍳🫙',cat:'trending',ingredients:['鸡蛋','番茄酱','糖','醋','淀粉','葱','蒜'],desc:'鸡蛋煎至两面金黄盛出。54321糖醋汁：5勺水+4勺番茄酱+3勺糖+2勺醋+1勺淀粉+少许盐。锅中炒香葱蒜，倒料汁烧开至浓稠，放鸡蛋翻匀裹汁，撒葱花白芝麻。' },

  // === 国民家常 ===
  { id:'m6',name:'西红柿炒鸡蛋',icon:'🍅🥚',cat:'home',ingredients:['西红柿','鸡蛋','葱','糖','盐'],desc:'鸡蛋加少许盐和水打散，热油炒熟盛出。西红柿切块，炒至软烂出汁，加一勺糖提鲜，倒回鸡蛋翻匀，撒葱花出锅。拌饭拌面都绝。' },
  { id:'m7',name:'辣椒炒肉',icon:'🌶️🥩',cat:'home',ingredients:['猪肉','青椒','豆豉','蒜','生抽','老抽'],desc:'五花肉切薄片，青椒斜切。干锅煸青椒至起虎皮盛出。煸五花肉出油至微焦，加豆豉蒜片爆香，生抽老抽调味，倒回青椒大火快翻。' },
  { id:'m8',name:'麻婆豆腐',icon:'🧈🌶️',cat:'home',ingredients:['豆腐','猪肉末','豆瓣酱','花椒粉','蒜','生抽'],desc:'豆腐切2cm块，盐水焯烫2分钟。炒肉末至干香，加豆瓣酱炒出红油，加蒜末+水烧开。轻放豆腐小火煮5分钟入味，水淀粉勾芡，撒花椒粉葱花。' },
  { id:'m9',name:'鱼香肉丝',icon:'🥩🥕',cat:'home',ingredients:['猪肉','胡萝卜','木耳','青椒','豆瓣酱','糖','醋','生抽','淀粉'],desc:'肉丝+盐+葱姜水+淀粉上浆，封油。热油滑炒至变色盛出。炒豆瓣酱出红油，加胡萝卜木耳青椒丝翻炒，倒回肉丝。鱼香汁：2勺生抽+2勺醋+1勺糖+1勺淀粉+3勺水，淋入大火收汁。' },
  { id:'m10',name:'红烧肉',icon:'🍖',cat:'feast',ingredients:['五花肉','冰糖','八角','桂皮','香叶','生抽','老抽','料酒'],desc:'五花肉切3cm块，冷水下锅+料酒焯水捞出。小火炒冰糖至焦糖色起泡，下肉块裹匀。加开水没过肉，八角桂皮香叶+生抽老抽，小火炖1h。大火收汁至浓稠挂筷。' },
  { id:'m11',name:'可乐鸡翅',icon:'🍗🥤',cat:'home',ingredients:['鸡翅','可乐','生抽','老抽','姜','料酒'],desc:'鸡翅划两刀，冷水+姜+料酒焯水。热油煎至两面金黄，倒可乐没过鸡翅（约300ml）+2勺生抽+1勺老抽。大火烧开转中火15分钟，收汁时不停翻动防止粘锅。' },
  { id:'m12',name:'宫保鸡丁',icon:'🐔🥜',cat:'feast',ingredients:['鸡胸肉','花生米','黄瓜','胡萝卜','干辣椒','花椒','生抽','醋','糖','淀粉'],desc:'鸡胸肉切丁+盐+料酒+淀粉上浆。花生小火炒至微黄。调汁：2勺生抽+2勺醋+2勺糖+1勺淀粉+3勺水。热油滑鸡丁至白盛出。干辣椒花椒爆香，加胡萝卜黄瓜丁，倒鸡丁+汁大火翻，撒花生。' },
  { id:'m13',name:'清蒸鲈鱼',icon:'🐟',cat:'feast',ingredients:['鲈鱼','姜','葱','蒸鱼豉油','料酒'],desc:'鱼身划三刀，塞姜片，淋料酒。水开上锅大火蒸8分钟（1斤鱼），关火虚蒸2分钟。倒掉蒸出的腥汤！铺新鲜葱丝，先淋一勺热油激香，再沿盘边淋蒸鱼豉油。' },
  { id:'m14',name:'酸辣土豆丝',icon:'🥔🌶️',cat:'quick',ingredients:['土豆','青椒','干辣椒','花椒','醋','盐'],desc:'土豆切细丝（越细越好），泡水洗去淀粉沥干。水中加1勺醋焯土豆丝30秒。热油爆干辣椒花椒，大火快炒土豆丝青椒丝30秒，加盐+锅边醋翻匀出锅。全程不超过1分钟。' },
  { id:'m15',name:'蒜蓉西兰花',icon:'🥦🧄',cat:'quick',ingredients:['西兰花','蒜','蚝油','盐'],desc:'西兰花掰小朵，盐水泡10分钟。水开+盐+几滴油，焯水1分钟捞出过凉水（保脆保绿）。热油小火炒蒜末至金黄，加蚝油+少许水调汁，淋在摆好盘的西兰花上。' },

  // === 抖音热门快手菜 ===
  { id:'m16',name:'孜然火腿土豆丁',icon:'🥔🍖',cat:'quick',ingredients:['土豆','火腿肠','孜然粉','辣椒面','白芝麻','盐'],desc:'土豆切1cm小丁，油热中小火煎至八面金黄焦脆。火腿肠切丁入锅炒香。撒孜然粉+辣椒面+白芝麻+盐，大火翻炒30秒，香气扑鼻出锅。' },
  { id:'m17',name:'红烧茄子',icon:'🍆',cat:'home',ingredients:['茄子','淀粉','蒜','青椒','生抽','蚝油','糖'],desc:'茄子切滚刀块，洒水裹玉米淀粉，六成油温炸至金黄酥脆。调汁：生抽2+蚝油1+糖1+盐少许+淀粉1+清水4。少油炒蒜末，倒汁熬浓，加茄子青红椒翻匀。' },
  { id:'m18',name:'香辣肉末粉条',icon:'🍝🌶️',cat:'home',ingredients:['粉条','猪肉末','豆瓣酱','蒜','生抽','老抽'],desc:'粉条温水泡软20分钟剪段。热油炒肉末至干香酥脆，加豆瓣酱炒出红油，加蒜末。加开水+生抽老抽，放粉条中小火焖3-5分钟。大火收汁，撒葱花出锅。' },
  { id:'m19',name:'干锅碎碎虾',icon:'🦐🔥',cat:'feast',ingredients:['虾','蒜','小米辣','豆瓣酱','洋葱','芹菜'],desc:'大虾开背去线剪成三段。热油煸虾至外壳酥脆盛出。炒香蒜末小米辣+豆瓣酱出红油，加洋葱丝芹菜段翻炒，倒回虾段大火翻炒，撒芝麻出锅。' },
  { id:'m20',name:'黄瓜火腿炒鸡蛋',icon:'🥒🍖🥚',cat:'quick',ingredients:['黄瓜','火腿肠','鸡蛋','蒜','盐'],desc:'黄瓜切菱形片，火腿肠切片。鸡蛋打散炒熟盛出。炒香蒜末，加火腿片煎至微焦，加黄瓜片大火快炒30秒，倒回鸡蛋，盐调味翻匀出锅。' },
  { id:'m21',name:'清炒四季豆',icon:'🫘',cat:'quick',ingredients:['四季豆','蒜','干辣椒','盐'],desc:'四季豆斜切段（更入味）。水开+盐+几滴油，焯水2分钟（必须焯透去毒素）。热油爆蒜末干辣椒，大火快炒四季豆，盐调味翻匀出锅。' },
  { id:'m22',name:'金钱蛋',icon:'🥚🪙',cat:'home',ingredients:['鸡蛋','蒜苔','蒜','小米辣','生抽','老抽','蚝油','胡椒粉'],desc:'鸡蛋蒸熟剥壳，用细线切开（不用刀防散）。七成油温炸至两面金黄起皱。炒香蒜末小米辣+蒜苔粒，倒鸡蛋，加生抽+老抽+蚝油+胡椒粉大火爆炒出锅。' },
  { id:'m23',name:'鱼香茄子',icon:'🍆🌶️',cat:'home',ingredients:['茄子','豆瓣酱','姜','蒜','糖','醋','生抽','淀粉'],desc:'茄子切条+盐腌15分钟，挤干水分洗净。少油炒姜蒜+豆瓣酱出红油，放茄子+鱼香汁(糖1+醋1+生抽2+水3+淀粉1)，中小火焖5分钟，放青红椒大火收汁。' },
  { id:'m24',name:'青椒爆蛋',icon:'🫑🥚',cat:'quick',ingredients:['青椒','鸡蛋','盐','白醋'],desc:'青椒干锅煸至起虎皮出香味切碎。鸡蛋+盐+几滴白醋打散，拌入青椒碎。热油倒入蛋液，煎至底部定型后翻炒成大块，表面微焦最香。' },
  { id:'m25',name:'白灼西兰花',icon:'🥦',cat:'quick',ingredients:['西兰花','蒜','蒸鱼豉油','蚝油'],desc:'西兰花掰小朵盐水泡洗。水开+盐+油，焯水90秒捞出立刻过冰水。摆盘，蒜末用热油激香，加蒸鱼豉油+蚝油调汁淋上。低卡高纤维！' },

  // === 硬菜系列 ===
  { id:'m26',name:'香辣大虾',icon:'🦐🌶️',cat:'feast',ingredients:['虾','干辣椒','花椒','蒜','姜','豆瓣酱','生抽'],desc:'大虾开背去虾线，加料酒姜腌制。热油煎虾至壳酥盛出。小火炒香干辣椒+花椒+姜蒜+豆瓣酱出红油，倒回虾+生抽大火翻炒，撒白芝麻葱花。' },
  { id:'m27',name:'素炒平菇',icon:'🍄',cat:'quick',ingredients:['平菇','蒜','青椒','生抽','蚝油'],desc:'平菇撕小条，热水焯30秒挤干。热油炒蒜末，放平菇大火翻炒至边缘微焦，加青椒丝+生抽+蚝油翻炒出锅。口感像肉一样！' },
  { id:'m28',name:'菠菜淋汁',icon:'🌿',cat:'quick',ingredients:['菠菜','蒜','生抽','蚝油','芝麻'],desc:'菠菜洗净不去根（根最甜）。水开+盐+油，焯水30秒捞出过凉挤干。摆盘，蒜末+生抽+蚝油+少许水煮开淋上，撒白芝麻。' },
  { id:'m29',name:'香干炒豆芽',icon:'🫓🌱',cat:'quick',ingredients:['豆芽','蒜','韭菜','生抽'],desc:'成本不到5块！香干切条。热油爆蒜，放豆芽大火炒至断生，加香干翻炒，生抽调味，最后放韭菜段快翻10秒出锅。从备菜到出锅5分钟。' },
  { id:'m30',name:'排骨炖冬瓜',icon:'🍖🍈',cat:'soup',ingredients:['排骨','冬瓜','姜','枸杞','盐','料酒'],desc:'排骨冷水下锅+料酒姜片焯水，温水洗净。开水下排骨+姜片，大火滚10分钟转小火炖40分钟。冬瓜去皮切块，下锅再炖15分钟，加枸杞+盐调味。' },
  { id:'m31',name:'葱烧木耳',icon:'🧅🪵',cat:'home',ingredients:['木耳','大葱','生抽','蚝油','糖','淀粉'],desc:'木耳冷水泡发3小时撕小朵。大葱切斜段。热油小火煸葱段至焦黄出香，放木耳大火翻炒，生抽+蚝油+少许糖调味，水淀粉勾薄芡出锅。' },
  { id:'m32',name:'炒莲藕',icon:'🪷',cat:'quick',ingredients:['莲藕','白醋','糖','盐'],desc:'莲藕去皮切薄片，立刻泡入加白醋的水中。水开+白醋焯藕片1分钟，捞出过凉。热油爆姜丝，下藕片大火快炒，加糖+盐+白醋，青红椒配色。全程不加水！' },
  { id:'m33',name:'黄焖牛肉',icon:'🐂🍲',cat:'feast',ingredients:['牛肉','土豆','胡萝卜','八角','桂皮','生抽','老抽','黄豆酱'],desc:'牛腩切块，冷水泡30分钟去血水（不焯水保持肉香）。炒糖色+牛肉煸至微焦，加开水！+八角桂皮+黄豆酱+生抽老抽，小火炖1.5h。加土豆胡萝卜再炖20分钟大火收汁。' },
  { id:'m34',name:'清炒西葫芦',icon:'🥒',cat:'quick',ingredients:['西葫芦','蒜','干辣椒','盐'],desc:'西葫芦去瓤（瓤会出水），切半月片。加少许盐腌10分钟挤干水。热油爆蒜干辣椒，大火快炒1分钟，加少许生抽翻匀出锅。全程大火！' },

  // === 经典名菜 ===
  { id:'m35',name:'水煮肉片',icon:'🥩🌶️🔥',cat:'feast',ingredients:['猪肉','豆芽','干辣椒','花椒','豆瓣酱','蒜','生抽','淀粉'],desc:'猪里脊切薄片+盐+料酒+蛋清+淀粉上浆。干辣椒花椒小火炒香切碎(刀口辣椒)。炒豆瓣酱出红油+水烧开，豆芽焯水铺碗底。肉片一片片滑入锅中，变色即捞出铺豆芽上。撒蒜末+刀口辣椒，浇滚烫热油。' },
  { id:'m36',name:'回锅肉',icon:'🥩🫑',cat:'home',ingredients:['五花肉','蒜苗','豆瓣酱','豆豉','青椒','姜','生抽'],desc:'五花肉整块冷水+姜+料酒煮20分钟，筷子能扎透捞出，切薄片。干锅煸青椒至虎皮。少油煸肉片至卷曲出油(灯盏窝)，加豆瓣酱+豆豉炒出红油，加青椒蒜苗生抽大火翻。' },
  { id:'m37',name:'地三鲜',icon:'🥔🍆🫑',cat:'home',ingredients:['土豆','茄子','青椒','蒜','生抽','糖','淀粉'],desc:'土豆切滚刀块，茄子切滚刀块裹淀粉，青椒切块。分别油炸：土豆炸金黄、茄子炸焦脆、青椒炸10秒。少油炒蒜，加生抽+糖+水+淀粉熬汁，倒三样快翻出锅。' },
  { id:'m38',name:'糖醋里脊',icon:'🥩🫙',cat:'feast',ingredients:['猪里脊','番茄酱','糖','白醋','淀粉','鸡蛋'],desc:'里脊切条+盐+料酒腌15分钟。调面糊：淀粉+鸡蛋+少许水调成酸奶状。里脊裹糊，六成油温炸至微黄捞出，七成油温复炸至金黄酥脆。糖醋汁：番茄酱3+糖2+白醋1+水5+淀粉1，熬浓淋上或蘸食。' },
  { id:'m39',name:'酸菜鱼',icon:'🐟🥬',cat:'feast',ingredients:['鱼片','酸菜','干辣椒','花椒','姜','蒜','蛋清','淀粉'],desc:'鱼片+盐+料酒+蛋清+淀粉上浆。热油炒酸菜出香盛出。炒姜蒜干辣椒+酸菜+开水烧开，加盐+白醋+少许糖。转小火，鱼片一片片滑入，煮1分钟变白即关火。撒蒜末干辣椒花椒，浇滚油激香。' },
  { id:'m40',name:'干煸四季豆',icon:'🫘🌶️',cat:'home',ingredients:['四季豆','猪肉末','干辣椒','花椒','芽菜','蒜','生抽'],desc:'四季豆去筋掰段，擦干水分。多油中小火煸炒至表皮起皱微焦（约5分钟），盛出。炒肉末至酥香，加干辣椒花椒蒜末芽菜炒香，倒回四季豆+生抽大火翻炒均匀。' },
  { id:'m41',name:'蒜蓉粉丝蒸虾',icon:'🦐🧄',cat:'feast',ingredients:['虾','粉丝','蒜','小米辣','蒸鱼豉油','蚝油','葱'],desc:'粉丝温水泡软铺盘底。大虾开背去线，码在粉丝上。蒜末+小米辣+蚝油+蒸鱼豉油调成蒜蓉酱，铺虾身上。水开上锅大火蒸6分钟，出锅撒葱花，淋滚热油激香。' },
  { id:'m42',name:'红烧排骨',icon:'🍖🔥',cat:'feast',ingredients:['排骨','冰糖','八角','桂皮','生抽','老抽','料酒','姜'],desc:'排骨冷水+料酒+姜焯水，温水洗净。小火炒冰糖至焦糖色，下排骨翻炒上色。加开水没过排骨，八角+桂皮+生抽+老抽，大火烧开转小火炖40分钟。加盐，大火收汁至浓稠。' },
  { id:'m43',name:'京酱肉丝',icon:'🥩🧅',cat:'feast',ingredients:['猪里脊','大葱','甜面酱','糖','生抽','淀粉','豆腐皮'],desc:'里脊切细丝+盐+料酒+蛋清+淀粉上浆。大葱切细丝铺盘底。热油滑炒肉丝至白盛出。小火炒甜面酱+糖+生抽+少许水，倒肉丝大火翻匀，铺在葱丝上。豆腐皮切方块围边，卷着吃。' },
  { id:'m44',name:'锅包肉',icon:'🥩🫙',cat:'feast',ingredients:['猪里脊','土豆淀粉','白醋','糖','胡萝卜','姜','葱'],desc:'里脊切厚片拍松。土豆淀粉+水沉淀，倒掉水用湿淀粉抓肉。糖醋汁：糖3+白醋3+少许生抽搅匀。六成油温一片片下肉炸定型捞出，七成复炸至金黄酥脆。少油炒姜丝胡萝卜丝+糖醋汁熬浓，倒肉片快翻出锅，趁热吃最脆！' },

  // === 暖心汤羹 ===
  { id:'m45',name:'白菜豆腐汤',icon:'🥬🧈',cat:'soup',ingredients:['大白菜','豆腐','姜','枸杞','盐'],desc:'白菜手撕大片（不用刀更有口感）。豆腐切2cm块。清水+姜片烧开，放白菜煮软，加豆腐小火煮5分钟。加盐+枸杞，淋几滴香油出锅。食材原味最动人。' },
  { id:'m46',name:'冬瓜排骨汤',icon:'🍈🍖',cat:'soup',ingredients:['排骨','冬瓜','薏米','姜','盐','枸杞'],desc:'排骨焯水洗净。薏米提前泡2小时。排骨+薏米+姜片+足量开水，大火10分钟转小火炖1小时。冬瓜去皮切大块（大块不易烂），加冬瓜再炖20分钟，盐+枸杞调味。' },
  { id:'m47',name:'番茄菌菇汤',icon:'🍅🍄',cat:'soup',ingredients:['西红柿','金针菇','香菇','豆腐','鸡蛋','盐'],desc:'西红柿切块炒出汁，加开水烧开。放金针菇+香菇片+豆腐块，煮5分钟。淋入打散的蛋液，关火静置30秒让蛋花成型。盐+白胡椒粉调味，撒葱花。' },

  // === 凉菜系列 ===
  { id:'m48',name:'凉拌黄瓜',icon:'🥒',cat:'cold',ingredients:['黄瓜','蒜','醋','生抽','辣椒油','糖','芝麻'],desc:'黄瓜装保鲜袋中用刀背拍裂（汁不溅），取出切段。酱汁：蒜末+生抽2+醋2+糖半勺+辣椒油1+芝麻。淋汁拌匀，冷藏10分钟更脆爽入味！' },
  { id:'m49',name:'凉拌木耳',icon:'🪵🌶️',cat:'cold',ingredients:['木耳','蒜','香菜','醋','生抽','辣椒油','糖'],desc:'木耳冷水泡发3小时洗净焯水2分钟。过冰水沥干。酱汁：蒜末+生抽2+陈醋2+糖1+辣椒油+香油。拌匀冷藏15分钟，上桌前撒香菜。' },
  { id:'m50',name:'韭菜炒鸡蛋',icon:'🌾🥚',cat:'home',ingredients:['韭菜','鸡蛋','盐'],desc:'韭菜切3cm段，梗和叶分开放。鸡蛋+盐打散，热油炒熟盛出。大火先炒韭菜梗10秒，加韭菜叶炒5秒，倒回鸡蛋翻匀出锅。全程不超过30秒，过火就老了！' },

  // === 第二批50道 ===
  { id:'m51',name:'蛋炒饭',icon:'🍚🍳',cat:'quick',ingredients:['鸡蛋','葱','盐'],desc:'隔夜饭捏散（粒粒分明）。鸡蛋打散，热油炒熟盛出。热油爆葱花，倒米饭大火炒至粒粒跳起，加盐+蛋碎翻匀。出锅前淋几滴香油。' },
  { id:'m52',name:'番茄炖牛腩',icon:'🍅🐂',cat:'feast',ingredients:['牛肉','西红柿','土豆','洋葱','八角','生抽','糖'],desc:'牛腩焯水切块。西红柿一半切丁炒成酱，一半切大块。热油炒洋葱+番茄丁出红油，加牛腩+开水+八角+生抽+糖，小火炖1.5h。加土豆+大块番茄再炖20min，大火收汁。' },
  { id:'m53',name:'醋溜白菜',icon:'🥬🍶',cat:'quick',ingredients:['大白菜','干辣椒','醋','生抽','糖','淀粉'],desc:'白菜帮和叶分开，帮斜切片叶手撕。热油爆干辣椒，先炒白菜帮1分钟至透亮，加叶翻炒。料汁：醋2+生抽1+糖半勺+淀粉+水，淋入大火翻炒挂汁出锅。酸脆爽口！' },
  { id:'m54',name:'蚝油生菜',icon:'🥗🦪',cat:'quick',ingredients:['生菜','蒜','蚝油','生抽','糖'],desc:'生菜掰开洗净。水开+盐+油，生菜焯烫10秒捞出装盘。热油小火炒蒜末至金黄，加蚝油+生抽+糖+少量水煮开，淋在生菜上。翠绿脆嫩3分钟搞定。' },
  { id:'m55',name:'家常豆腐',icon:'🧈🏠',cat:'home',ingredients:['豆腐','猪肉','青椒','木耳','豆瓣酱','生抽'],desc:'老豆腐切三角块，六成油温炸至表面金黄硬壳（或煎至金黄）。肉片煸至出油，加豆瓣酱炒红，加青椒木耳翻炒，加少许水+生抽，放豆腐焖3分钟入味，勾薄芡出锅。' },
  { id:'m56',name:'蒜蓉空心菜',icon:'🥬🧄',cat:'quick',ingredients:['空心菜','蒜','盐'],desc:'空心菜择段，梗和叶分开。热油下一半蒜末爆香，先炒梗30秒，加叶和剩下一半蒜大火快炒至叶蔫，盐调味。全程大火不超过2分钟。炒完不出水！' },
  { id:'m57',name:'葱油拌面',icon:'🍜🧅',cat:'quick',ingredients:['葱','生抽','老抽','糖','食用油'],desc:'小葱切段。锅中倒油，小火慢炸葱段至金黄焦脆（约8分钟），捞出葱段留葱油。碗中调汁：生抽2+老抽1+糖1搅匀。面煮熟捞出，淋葱油+酱汁拌匀，放焦葱段。' },
  { id:'m58',name:'黄豆焖猪蹄',icon:'🍖🫘',cat:'feast',ingredients:['猪肉','黄豆','八角','桂皮','生抽','老抽','冰糖'],desc:'猪蹄剁块焯水洗净。黄豆提前泡4小时。炒糖色至焦黄，下猪蹄上色，加开水+黄豆+八角桂皮+生抽老抽，大火烧开转小火炖2h至猪蹄软糯，大火收汁至浓稠。' },
  { id:'m59',name:'啤酒鸭',icon:'🦆🍺',cat:'feast',ingredients:['鸡肉','啤酒','青椒','干辣椒','八角','蒜','生抽','老抽'],desc:'鸭肉剁块焯水。热油炒鸭块至表面焦黄出油，加干辣椒+八角+蒜爆香，倒一罐啤酒没过鸭肉，加生抽老抽，大火烧开转小火炖40min。加青椒块大火收汁，汤汁浓稠挂肉。' },
  { id:'m60',name:'酸豆角炒肉末',icon:'🫘🥩',cat:'home',ingredients:['猪肉','酸豆角','蒜','小米辣','生抽'],desc:'酸豆角冲洗后切小粒。热油煸肉末至酥香，加蒜末小米辣爆香，放酸豆角大火翻炒3分钟，加少许生抽和糖调味。酸辣下饭，拌面拌饭都绝配！' },
  { id:'m61',name:'肉末蒸蛋',icon:'🥚🥩',cat:'quick',ingredients:['鸡蛋','猪肉末','葱','生抽','盐'],desc:'鸡蛋打散+1.5倍温水+盐搅匀，过滤气泡，盖保鲜膜扎孔。水开上锅小火蒸10分钟。另锅炒肉末+生抽+葱花铺在蒸蛋表面，淋少许蒸鱼豉油。滑嫩如布丁！' },
  { id:'m62',name:'剁椒鱼头',icon:'🐟🌶️',cat:'feast',ingredients:['鱼','剁椒','蒜','姜','蒸鱼豉油','葱'],desc:'鱼头从背部劈开洗净，抹料酒+姜片腌15分钟。盘底铺姜片，放鱼头，铺满剁椒+蒜末。水开上锅大火蒸12分钟，倒掉腥汤，淋蒸鱼豉油+葱花，浇滚烫热油激香。' },
  { id:'m63',name:'干煸牛肉丝',icon:'🐂🌶️',cat:'feast',ingredients:['牛肉','芹菜','干辣椒','花椒','姜','生抽','豆瓣酱'],desc:'牛肉切粗丝（横纹切），加料酒+生抽腌10分钟。多油煸牛肉丝至水分蒸发、表面焦褐盛出。炒干辣椒+花椒+姜丝+豆瓣酱出香，倒回牛肉丝+芹菜段大火翻炒，加少许糖提鲜。' },
  { id:'m64',name:'玉米排骨汤',icon:'🌽🍖',cat:'soup',ingredients:['排骨','玉米','胡萝卜','姜','盐','枸杞'],desc:'排骨焯水洗净。玉米切段，胡萝卜切滚刀块。排骨+姜片+足量开水，大火滚15分钟转小火炖40分钟。加玉米+胡萝卜再炖25分钟，加盐+枸杞调味。汤清甜回甘。' },
  { id:'m65',name:'菌菇鸡汤',icon:'🍄🐔',cat:'soup',ingredients:['鸡胸肉','香菇','杏鲍菇','姜','枸杞','盐','料酒'],desc:'鸡肉切块焯水。砂锅加足量水，放鸡块+姜片+料酒，大火烧开撇浮沫，转小火炖1h。加香菇+杏鲍菇片再炖20分钟，加盐+枸杞。金黄油亮，鲜美无比！' },
  { id:'m66',name:'南瓜粥',icon:'🎃🥣',cat:'soup',ingredients:['南瓜','大米','冰糖'],desc:'南瓜去皮切小块，大米淘洗。水开下大米煮15分钟至米开花，加南瓜块继续小火熬15分钟，期间不停搅拌防止粘底。加冰糖调味，南瓜软烂与粥融为一体。' },
  { id:'m67',name:'山药炖排骨',icon:'🥔🍖',cat:'soup',ingredients:['排骨','山药','姜','盐','枸杞','料酒'],desc:'排骨焯水洗净。山药去皮切段（戴手套防痒，泡水防氧化）。排骨+姜+料酒+足量水，大火10分钟转小火炖40分钟。加山药再炖15分钟，盐+枸杞调味。山药粉糯即出锅。' },
  { id:'m68',name:'粉蒸肉',icon:'🥩🍚',cat:'feast',ingredients:['五花肉','蒸肉粉','土豆','生抽','老抽','料酒','豆瓣酱'],desc:'五花肉切0.5cm厚片，加豆瓣酱+生抽+老抽+料酒腌30分钟。裹上蒸肉粉，每片都均匀粘满。土豆切片铺盘底，码上肉片。水开上锅大火蒸1h，出锅撒葱花。' },
  { id:'m69',name:'油焖大虾',icon:'🦐🧄',cat:'feast',ingredients:['虾','蒜','姜','生抽','糖','料酒','葱'],desc:'大虾去须开背去线。多油煎虾至两面金黄壳酥，用锅铲压虾头挤出虾油。加蒜末姜丝炒香，淋料酒+生抽+糖+少量水，盖盖焖2分钟。开盖大火收汁至浓稠，撒葱花。' },
  { id:'m70',name:'蒜薹炒肉',icon:'🌱🥩',cat:'home',ingredients:['猪肉','蒜苔','姜','生抽','老抽'],desc:'蒜苔切3cm段。五花肉切薄片煸出油至微焦，加姜丝爆香。放蒜苔大火翻炒2分钟至表皮微皱，生抽+老抽调味。蒜苔自带甜味，不需要加糖。' },
  { id:'m71',name:'芹菜香干',icon:'🌱🫓',cat:'quick',ingredients:['芹菜','豆皮','蒜','干辣椒','生抽'],desc:'芹菜斜切段，香干切条。水开+盐，芹菜焯水30秒捞出。热油爆蒜干辣椒，炒香干至表面微黄，加芹菜大火快翻，生抽调味。清爽脆嫩配饭神器。' },
  { id:'m72',name:'酸辣白菜帮',icon:'🥬🌶️',cat:'quick',ingredients:['大白菜','干辣椒','花椒','醋','生抽','糖'],desc:'只取白菜帮斜切成片（叶留着做汤）。热油爆干辣椒+花椒，大火快炒白菜帮1分钟至透亮。碗汁：醋3+生抽1+糖半勺+淀粉+水，淋入快速翻炒挂汁。酸辣脆爽！' },
  { id:'m73',name:'泡椒凤爪',icon:'🐔🌶️',cat:'cold',ingredients:['泡椒','鸡翅','姜','料酒','白醋','糖','盐'],desc:'鸡爪剪指甲洗净，冷水+姜+料酒焯水煮开撇浮沫，转小火煮8分钟。捞出立刻泡冰水（皮才脆弹）。泡椒连汁+白醋+糖+盐+凉白开调成泡汁，放鸡爪冷藏过夜。' },
  { id:'m74',name:'凉拌三丝',icon:'🥒🥕',cat:'cold',ingredients:['黄瓜','胡萝卜','豆皮','蒜','醋','生抽','辣椒油','芝麻'],desc:'黄瓜、胡萝卜、豆皮均切细丝。胡萝卜丝焯水10秒过凉。三丝码盘。酱汁：蒜末+生抽2+醋2+辣椒油1+糖+芝麻。淋汁拌匀，冷藏10分钟更入味。' },
  { id:'m75',name:'皮蛋豆腐',icon:'🥚🧈',cat:'cold',ingredients:['豆腐','皮蛋','蒜','生抽','醋','辣椒油','香油','葱'],desc:'内酯豆腐倒扣盘中，用刀划成片。皮蛋切瓣围边。酱汁：蒜末+生抽2+醋1+辣椒油+香油+少许糖搅匀。酱汁淋在豆腐上，撒葱花。冰镇后吃更佳！' },
  { id:'m76',name:'口水鸡',icon:'🐔🌶️',cat:'cold',ingredients:['鸡胸肉','花生米','芝麻','蒜','辣椒油','花椒粉','生抽','醋','糖'],desc:'鸡胸肉冷水下锅+姜+料酒，水开煮10分钟关火焖5分钟，捞出冰水过凉撕成丝。酱汁：辣椒油+花椒粉+蒜末+生抽+醋+糖+芝麻调匀。酱汁浇在鸡丝上，撒花生碎+葱花。' },
  { id:'m77',name:'红烧牛肉面',icon:'🍜🐂',cat:'feast',ingredients:['牛肉','面条','八角','桂皮','生抽','老抽','冰糖','葱'],desc:'牛腩切块焯水。小火炒冰糖至焦糖色，下牛肉上色，加开水+八角桂皮+生抽老抽，小火炖1.5h。另锅煮面捞出盛碗，浇牛肉和汤，撒葱花。一碗顶饱！' },
  { id:'m78',name:'土豆烧牛腩',icon:'🥔🐂',cat:'feast',ingredients:['牛肉','土豆','胡萝卜','八角','桂皮','生抽','老抽','料酒'],desc:'牛腩焯水切块。炒糖色+牛肉煸至微焦，加开水+八角桂皮+生抽老抽+料酒，小火炖1h。加土豆块+胡萝卜块再炖25分钟，大火收汁至汤汁浓稠挂勺。' },
  { id:'m79',name:'清炒山药片',icon:'🥔🌿',cat:'quick',ingredients:['山药','青椒','蒜','盐'],desc:'山药去皮切菱形片（戴手套），泡水防氧化。水开+几滴白醋焯山药30秒捞出。热油爆蒜片，下山药+青椒片大火快炒1分钟，盐调味出锅。雪白脆嫩！' },
  { id:'m80',name:'香菇炒肉片',icon:'🍄🥩',cat:'home',ingredients:['猪肉','香菇','青椒','蒜','生抽','蚝油'],desc:'肉切片+生抽+淀粉上浆。香菇切片，青椒切块。热油滑肉片至变色盛出。炒蒜末+香菇至出汁，加青椒翻炒，倒回肉片+蚝油+生抽大火翻匀。' },

// ============ STATE ============
let cart = {};
let activeCat = 'leaf';
let currentTab = 'menu';
let activeMenuFilter = 'all';

// ============ RENDER ============
function renderCatTabs() {
  const container = document.getElementById('catTabs');
  container.innerHTML = categories.map(c =>
    `<div class="cat-tab ${c.id === activeCat ? 'active' : ''}" onclick="setCategory('${c.id}')">${c.name}</div>`
  ).join('');
}

function renderVegGrid() {
  const container = document.getElementById('vegGrid');
  const items = vegetables.filter(v => v.cat === activeCat && v.listed);
  container.innerHTML = items.map(v => {
    const qty = cart[v.id] || 0;
    const soldOut = v.stock <= 0;
    const lowStock = !soldOut && v.stock <= 5;
    return `
      <div class="veg-card${soldOut ? ' veg-oos' : ''}" onclick="${soldOut ? '' : "addToCart('" + v.id + "')"}">
        ${qty > 0 ? '<div class="veg-qty">' + qty + '</div>' : ''}
        ${lowStock ? '<div class="veg-stock-low">仅剩' + v.stock + '份</div>' : ''}
        ${soldOut ? '<div class="veg-stock-low" style="color:#999;background:#F5F5F5">售罄</div>' : ''}
        <span class="veg-emoji">${v.emoji}</span>
        <div class="veg-name">${v.name}</div>
        <div class="veg-price">¥${v.price.toFixed(1)}/份</div>
        <div class="veg-add">${soldOut ? '—' : '+'}</div>
      </div>`;
  }).join('');
}

function getTagClass(cat) {
  const map = { trending: 'trending', home: 'home', quick: 'quick', feast: 'feast', soup: 'soup', cold: 'cold' };
  return map[cat] || 'home';
}

function getTagLabel(cat) {
  const map = { trending: '2026爆款', home: '家常', quick: '快手', feast: '硬菜', soup: '汤羹', cold: '凉菜' };
  return map[cat] || cat;
}

function renderMenuFilters() {
  const container = document.getElementById('menuFilters');
  container.innerHTML = menuFilters.map(f =>
    `<div class="menu-filter-chip ${f.id === activeMenuFilter ? 'active' : ''}" onclick="setMenuFilter('${f.id}')">${f.name}</div>`
  ).join('');
}

function renderMenuList() {
  const container = document.getElementById('menuList');
  const countEl = document.getElementById('menuCount');
  const searchText = (document.getElementById('menuSearchInput').value || '').trim().toLowerCase();

  let filtered = menus.filter(m => {
    if (activeMenuFilter !== 'all' && m.cat !== activeMenuFilter) return false;
    if (!searchText) return true;
    return m.name.includes(searchText) || m.tag.includes(searchText) ||
           m.ingredients.some(i => i.includes(searchText)) || m.desc.includes(searchText);
  });

  container.innerHTML = filtered.map((m, idx) => `
    <div class="menu-card" style="animation: fadePage 0.35s ${idx * 0.04}s both">
      <div class="menu-card-inner" onclick="toggleMenuDetail(event, '${m.id}')">
        <div class="menu-card-icon-wrap">
          <span>${m.icon}</span>
        </div>
        <div class="menu-card-info">
          <div class="menu-card-header">
            <span class="menu-card-title">${m.name}</span>
            <span class="menu-card-tag ${getTagClass(m.cat)}">${getTagLabel(m.cat)}</span>
          </div>
          <div class="menu-card-ingredients">
            ${m.ingredients.map(i => `<span class="menu-card-ingredient">${i}</span>`).join('')}
          </div>
          <div class="menu-card-desc">${m.desc}</div>
        </div>
      </div>
      <div class="menu-card-detail" id="detail-${m.id}">${m.desc}</div>
      <div class="menu-card-action">
        <button class="menu-card-add" onclick="event.stopPropagation(); addMenuIngredients('${m.id}')">
          📋 一键加入购物车
        </button>
        <span class="menu-card-expand" onclick="event.stopPropagation(); toggleMenuDetail(event, '${m.id}')">查看做法 ▾</span>
      </div>
    </div>
  `).join('');

  countEl.textContent = filtered.length === 0 ? '没有找到匹配的菜谱' : `共 ${filtered.length} 道菜谱`;
}

function toggleMenuDetail(event, menuId) {
  const detail = document.getElementById('detail-' + menuId);
  if (detail) {
    detail.classList.toggle('show');
  }
}

// ============ RANDOM PICK ============
let randomPickMenu = null;
let spinTimer = null;

// random veggie on shop page
function randomVeg() {
  const available = vegetables.filter(v => v.listed && v.stock > 0);
  if (available.length === 0) { showToast('⚠️ 没有可用的食材'); return; }
  const v = available[Math.floor(Math.random() * available.length)];
  const currentQty = cart[v.id] || 0;
  if (currentQty >= v.stock) { showToast('⚠️ 「' + v.name + '」库存不足'); return; }
  cart[v.id] = currentQty + 1;
  renderVegGrid();
  updateBadges();
  showToast('🎲 随机选了「' + v.name + '」已加入购物车');
  // if current tab is shop, switch to the category of the random veg
  if (currentTab === 'shop') {
    activeCat = v.cat;
    renderCatTabs();
    renderVegGrid();
  }
}

function randomPick() {
  const overlay = document.getElementById('randomOverlay');
  const spinStage = document.getElementById('randomSpinStage');
  const resultStage = document.getElementById('randomResult');
  const spinIcon = document.getElementById('randomSpinIcon');
  const spinName = document.getElementById('randomSpinName');

  // reset state
  if (spinTimer) clearInterval(spinTimer);
  spinStage.style.display = 'block';
  resultStage.style.display = 'none';
  overlay.style.display = 'flex';

  // emoji pool for spinning
  const emojis = ['🍳','🍖','🥩','🦐','🐟','🍅','🥔','🍆','🫑','🥒','🥬','🍄','🧈','🥚','🍗','🌶️','🔥','🍲','🫘','🥜'];
  const allMenus = menus;
  let spinCount = 0;
  const totalSpins = 18 + Math.floor(Math.random() * 10); // 18-27 spins

  spinTimer = setInterval(() => {
    const ri = Math.floor(Math.random() * allMenus.length);
    const m = allMenus[ri];
    spinIcon.textContent = emojis[Math.floor(Math.random() * emojis.length)];
    spinName.textContent = m.name;
    spinCount++;

    if (spinCount >= totalSpins) {
      clearInterval(spinTimer);
      spinTimer = null;
      randomPickMenu = m;
      showRandomResult(m);
    }
  }, 60 + Math.floor(spinCount * 1.5)); // gradually slow down
}

function showRandomResult(menu) {
  const spinStage = document.getElementById('randomSpinStage');
  const resultStage = document.getElementById('randomResult');

  spinStage.style.display = 'none';
  resultStage.style.display = 'block';

  document.getElementById('randomResultIcon').textContent = menu.icon;
  document.getElementById('randomResultTitle').textContent = menu.name;

  const tagEl = document.getElementById('randomResultTag');
  tagEl.textContent = getTagLabel(menu.cat);
  tagEl.className = 'random-result-tag menu-card-tag ' + getTagClass(menu.cat);

  document.getElementById('randomResultIngredients').innerHTML =
    menu.ingredients.map(i => `<span class="random-result-ingredient">${i}</span>`).join('');

  document.getElementById('randomResultDesc').textContent = menu.desc;

  const addBtn = document.getElementById('randomResultAdd');
  addBtn.textContent = '📋 一键加入购物车';
  addBtn.className = 'random-result-add';
}

function addRandomToCart() {
  if (!randomPickMenu) return;
  addMenuIngredients(randomPickMenu.id);
  const addBtn = document.getElementById('randomResultAdd');
  addBtn.textContent = '✓ 已加入购物车';
  addBtn.classList.add('added');
  setTimeout(() => {
    addBtn.textContent = '📋 一键加入购物车';
    addBtn.classList.remove('added');
  }, 1500);
}

function closeRandom(e) {
  if (e.target === document.getElementById('randomOverlay')) {
    closeRandomDirect();
  }
}

function closeRandomDirect() {
  if (spinTimer) {
    clearInterval(spinTimer);
    spinTimer = null;
  }
  document.getElementById('randomOverlay').style.display = 'none';
  randomPickMenu = null;
}

function renderCart() {
  const container = document.getElementById('cartList');
  const footer = document.getElementById('cartFooter');
  const empty = document.getElementById('cartEmpty');
  const items = Object.entries(cart).filter(([,q]) => q > 0);

  if (items.length === 0) {
    container.innerHTML = '';
    footer.style.display = 'none';
    empty.style.display = 'block';
  } else {
    empty.style.display = 'none';
    footer.style.display = 'flex';
    container.innerHTML = items.map(([id, qty]) => {
      const v = vegetables.find(veg => veg.id === id);
      if (!v) return '';
      return `
        <div class="cart-item">
          <span class="cart-item-emoji">${v.emoji}</span>
          <div class="cart-item-info">
            <div class="cart-item-name">${v.name}</div>
            <div class="cart-item-price">¥${v.price.toFixed(1)} × ${qty} = ¥${(v.price * qty).toFixed(1)}</div>
          </div>
          <div class="cart-qty-wrap">
            <button class="cart-qty-btn" onclick="decreaseQty('${id}')">−</button>
            <span class="cart-qty-num">${qty}</span>
            <button class="cart-qty-btn" onclick="addToCart('${id}')">+</button>
          </div>
          <span class="cart-item-del" onclick="removeItem('${id}')">✕</span>
        </div>`;
    }).join('');

    const total = items.reduce((sum, [id, qty]) => {
      const v = vegetables.find(veg => veg.id === id);
      return sum + (v ? v.price * qty : 0);
    }, 0);
    document.getElementById('cartTotalPrice').textContent = '¥' + total.toFixed(1);
  }
}

function updateBadges() {
  const total = Object.values(cart).reduce((a, b) => a + b, 0);
  const badge = document.getElementById('cartBadge');
  const navBadge = document.getElementById('navCartBadge');

  badge.textContent = total;
  if (total > 0) {
    badge.classList.add('pop');
    setTimeout(() => badge.classList.remove('pop'), 400);
    navBadge.style.display = 'flex';
    navBadge.textContent = total;
  } else {
    navBadge.style.display = 'none';
  }
}

// ============ ACTIONS ============
function setCategory(catId) {
  activeCat = catId;
  renderCatTabs();
  renderVegGrid();
}

function setMenuFilter(filterId) {
  activeMenuFilter = filterId;
  renderMenuFilters();
  renderMenuList();
}

function addToCart(vegId) {
  const v = vegetables.find(vg => vg.id === vegId);
  if (!v || !v.listed) return;
  const currentQty = cart[vegId] || 0;
  if (currentQty >= v.stock) {
    showToast('⚠️ 「' + v.name + '」库存不足，当前库存 ' + v.stock + ' 份');
    return;
  }
  cart[vegId] = currentQty + 1;
  renderVegGrid();
  updateBadges();
  if (currentTab === 'cart') renderCart();
}

function decreaseQty(vegId) {
  if (cart[vegId] > 1) {
    cart[vegId]--;
  } else {
    delete cart[vegId];
  }
  renderVegGrid();
  renderCart();
  updateBadges();
}

function removeItem(vegId) {
  delete cart[vegId];
  renderVegGrid();
  renderCart();
  updateBadges();
}

function clearCart() {
  cart = {};
  renderVegGrid();
  renderCart();
  updateBadges();
}

// pending ingredients for confirm modal
let pendingOthers = [];

function getIngredientCategory(veg) {
  if (veg.cat === 'meat' || veg.cat === 'seafood') return 'main';
  if (veg.cat === 'condiment') return 'cond';
  return 'side';
}

function addMenuIngredients(menuId) {
  const menu = menus.find(m => m.id === menuId);
  if (!menu) return;

  // separate: main (meat/seafood) / side (veggies) / cond (ignored)
  // only include listed items with stock
  const mainItems = [];
  const sideItems = [];
  menu.ingredients.forEach(name => {
    const v = vegetables.find(veg => veg.name === name || (veg.alt && veg.alt.includes(name)));
    if (!v || !v.listed) return;
    const cat = getIngredientCategory(v);
    if (cat === 'main') mainItems.push(v);
    else if (cat === 'side') sideItems.push(v);
  });

  // if no main items (vegetarian), add side items directly without popup
  if (mainItems.length === 0) {
    let added = 0;
    sideItems.forEach(v => {
      const qty = cart[v.id] || 0;
      if (qty < v.stock) { cart[v.id] = qty + 1; added++; }
    });
    renderVegGrid();
    updateBadges();
    const badge = document.getElementById('cartBadge');
    badge.classList.add('pop');
    setTimeout(() => badge.classList.remove('pop'), 400);
    if (added > 0) brieffeedback(menuId, added);
    return;
  }

  // auto-add main items (check stock)
  let mainAdded = 0;
  mainItems.forEach(v => {
    const qty = cart[v.id] || 0;
    if (qty < v.stock) { cart[v.id] = qty + 1; mainAdded++; }
  });
  renderVegGrid();
  updateBadges();
  const badge = document.getElementById('cartBadge');
  badge.classList.add('pop');
  setTimeout(() => badge.classList.remove('pop'), 400);
  if (mainAdded > 0) brieffeedback(menuId, mainAdded);

  // show confirm popup for side vegetables only
  if (sideItems.length > 0) {
    pendingOthers = sideItems;
    showConfirmPopup(mainAdded, sideItems);
  }
}

function showConfirmPopup(mainCount, sideItems) {
  document.getElementById('confirmTitle').innerHTML =
    '已添加 <b>' + mainCount + '</b> 种主菜到购物车<br>还需要配菜吗？';
  document.getElementById('confirmList').innerHTML =
    '<div style="font-size:0.72rem;color:var(--sub);margin:8px 0 4px;">🥬 配菜</div>' +
    sideItems.map(v =>
      '<span class="confirm-item side"><span class="confirm-item-emoji">' + v.emoji + '</span>' + v.name + '</span>'
    ).join('');
  document.getElementById('confirmOverlay').style.display = 'flex';
}

function confirmAddAll() {
  let added = 0;
  pendingOthers.forEach(v => {
    const qty = cart[v.id] || 0;
    if (v.listed && qty < v.stock) { cart[v.id] = qty + 1; added++; }
  });
  pendingOthers = [];
  document.getElementById('confirmOverlay').style.display = 'none';
  renderVegGrid();
  updateBadges();
  const badge = document.getElementById('cartBadge');
  badge.classList.add('pop');
  setTimeout(() => badge.classList.remove('pop'), 400);
  showToast('✅ 已加入 ' + added + ' 种配菜');
}

function closeConfirm() {
  pendingOthers = [];
  document.getElementById('confirmOverlay').style.display = 'none';
}

// ============ PAYMENT SYSTEM ============
let selectedPayMethod = 'wechat';
let currentOrderTotal = 0;
let orders = JSON.parse(localStorage.getItem('grocery_orders') || '[]');

function openCheckout() {
  const items = Object.entries(cart).filter(([,q]) => q > 0);
  if (items.length === 0) { showToast('🛒 购物车是空的'); return; }

  const total = items.reduce((sum, [id, qty]) => {
    const v = vegetables.find(vg => vg.id === id);
    return sum + (v ? v.price * qty : 0);
  }, 0);
  currentOrderTotal = total;

  // render order items
  document.getElementById('payItems').innerHTML = items.map(([id, qty]) => {
    const v = vegetables.find(vg => vg.id === id);
    if (!v) return '';
    return '<div class="pay-item">' +
      '<span class="pay-item-emoji">' + v.emoji + '</span>' +
      '<div class="pay-item-info"><div class="pay-item-name">' + v.name + '</div>' +
      '<div class="pay-item-qty">x' + qty + '</div></div>' +
      '<span class="pay-item-price">¥' + (v.price * qty).toFixed(1) + '</span></div>';
  }).join('');

  document.getElementById('paySubtotal').textContent = '¥' + total.toFixed(1);
  document.getElementById('payTotal').textContent = '¥' + total.toFixed(1);
  document.getElementById('payTotalBtn').textContent = '¥' + total.toFixed(1);

  // reset steps
  document.getElementById('payStep1').style.display = 'block';
  document.getElementById('payStep2').style.display = 'none';
  document.getElementById('payStep3').style.display = 'none';
  selectedPayMethod = 'wechat';
  document.querySelectorAll('.pay-method').forEach(el => el.classList.remove('selected'));
  document.getElementById('payMethodWx').classList.add('selected');
  document.querySelector('input[name="payMethod"][value="wechat"]').checked = true;

  document.getElementById('payOverlay').style.display = 'flex';
}

function selectPayMethod(method) {
  selectedPayMethod = method;
  document.querySelectorAll('.pay-method').forEach(el => el.classList.remove('selected'));
  document.getElementById(method === 'wechat' ? 'payMethodWx' : method === 'alipay' ? 'payMethodAli' : 'payMethodCash').classList.add('selected');
}

function processPayment() {
  // show processing
  document.getElementById('payStep1').style.display = 'none';
  document.getElementById('payStep2').style.display = 'block';
  const methodNames = { wechat: '微信支付', alipay: '支付宝', cash: '现金支付' };
  document.getElementById('payProcessingText').textContent = '正在通过' + methodNames[selectedPayMethod] + '支付...';

  // simulate payment processing
  setTimeout(() => {
    completePayment();
  }, 1500 + Math.random() * 1000);
}

function completePayment() {
  document.getElementById('payStep2').style.display = 'none';
  document.getElementById('payStep3').style.display = 'block';

  document.getElementById('paySuccessAmount').textContent = '¥' + currentOrderTotal.toFixed(1);

  // generate order
  const orderId = 'ORD' + Date.now().toString(36).toUpperCase();
  document.getElementById('paySuccessOrder').textContent = '订单号: ' + orderId;

  const items = Object.entries(cart).filter(([,q]) => q > 0).map(([id, qty]) => {
    const v = vegetables.find(vg => vg.id === id);
    return { name: v ? v.name : id, price: v ? v.price : 0, qty: qty };
  });

  // save order
  orders.unshift({
    id: orderId,
    items: items,
    total: currentOrderTotal,
    method: selectedPayMethod,
    time: new Date().toLocaleString('zh-CN')
  });
  if (orders.length > 50) orders = orders.slice(0, 50);
  localStorage.setItem('grocery_orders', JSON.stringify(orders));

  // clear cart
  cart = {};
  renderVegGrid();
  updateBadges();
  renderCart();
}

function closePayment() {
  document.getElementById('payOverlay').style.display = 'none';
}

// ============ ORDER HISTORY (admin) ============
function renderOrderHistory() {
  const container = document.getElementById('adminOrderList');
  if (!container) return;
  if (orders.length === 0) {
    container.innerHTML = '<div style="text-align:center;padding:30px;color:var(--sub)">暂无订单记录</div>';
    return;
  }
  container.innerHTML = orders.map(o => {
    const methodNames = { wechat: '微信', alipay: '支付宝', cash: '现金' };
    return '<div class="order-card">' +
      '<div class="order-card-hd">' +
        '<span class="order-card-id">' + o.id + '</span>' +
        '<span class="order-card-time">' + o.time + '</span>' +
      '</div>' +
      '<div class="order-card-items">' +
        o.items.map(i => '<span class="order-card-item">' + i.name + ' x' + i.qty + '</span>').join('') +
      '</div>' +
      '<div class="order-card-ft">' +
        '<span class="order-card-method">' + methodNames[o.method] + '</span>' +
        '<span class="order-card-total">¥' + o.total.toFixed(1) + '</span>' +
      '</div>' +
    '</div>';
  }).join('');
}

function showToast(msg) {
  const toast = document.getElementById('randomToast');
  toast.textContent = msg;
  toast.classList.add('show');
  setTimeout(() => toast.classList.remove('show'), 1800);
}

function brieffeedback(menuId, added) {
  const btn = event && event.target;
  if (btn && btn.classList.contains('menu-card-add')) {
    const orig = btn.textContent;
    btn.textContent = '✓ 已加入 ' + added + ' 种';
    btn.style.background = 'var(--green)';
    btn.style.color = '#fff';
    setTimeout(() => {
      btn.textContent = orig;
      btn.style.background = '#fff';
      btn.style.color = 'var(--green)';
    }, 1500);
  }
}

function switchTab(tab) {
  currentTab = tab;
  document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
  document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));

  document.getElementById('page-' + tab).classList.add('active');
  document.getElementById('nav-' + tab).classList.add('active');

  if (tab === 'cart') renderCart();
  if (tab === 'menu') renderMenuList();
}

// ============ ADMIN ============
const ADMIN_PWD = '8888';
let isAdmin = false;
let adminActiveCat = 'all';

function initStock() {
  const saved = localStorage.getItem('grocery_inventory');
  if (saved) {
    const data = JSON.parse(saved);
    vegetables.forEach(v => {
      if (data[v.id] !== undefined) {
        v.stock = data[v.id].stock;
        v.listed = data[v.id].listed;
      } else {
        if (v.stock === undefined) v.stock = 99;
        if (v.listed === undefined) v.listed = true;
      }
    });
  } else {
    vegetables.forEach(v => {
      if (v.stock === undefined) v.stock = 99;
      if (v.listed === undefined) v.listed = true;
    });
  }
}

function saveStock() {
  const data = {};
  vegetables.forEach(v => { data[v.id] = { stock: v.stock, listed: v.listed }; });
  localStorage.setItem('grocery_inventory', JSON.stringify(data));
  updateAdminStats();
}

function showAdminLogin() {
  document.getElementById('adminPwdOverlay').style.display = 'flex';
  document.getElementById('adminPwdInput').value = '';
  setTimeout(() => document.getElementById('adminPwdInput').focus(), 200);
}

function closeAdminLogin() {
  document.getElementById('adminPwdOverlay').style.display = 'none';
}

function adminLogin() {
  const pwd = document.getElementById('adminPwdInput').value;
  if (pwd === ADMIN_PWD) {
    isAdmin = true;
    document.getElementById('adminPwdOverlay').style.display = 'none';
    showAdminPage();
  } else {
    const input = document.getElementById('adminPwdInput');
    input.style.borderColor = 'var(--pink)';
    input.placeholder = '密码错误，请重试';
    input.value = '';
    setTimeout(() => { input.style.borderColor = ''; input.placeholder = '请输入后台密码'; }, 1200);
  }
}

function showAdminPage() {
  document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
  document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
  document.getElementById('page-admin').classList.add('active');
  currentTab = 'admin';
  updateAdminStats();
  renderAdminFilters();
  renderAdminInventory();
  renderOrderHistory();
}

function exitAdmin() {
  isAdmin = false;
  document.getElementById('page-admin').classList.remove('active');
  switchTab('menu');
  renderVegGrid();
  renderMenuList();
}

function updateAdminStats() {
  const listed = vegetables.filter(v => v.listed);
  const unlisted = vegetables.filter(v => !v.listed);
  const oos = vegetables.filter(v => v.listed && v.stock <= 0);
  document.getElementById('adminStats').innerHTML =
    '<div class="admin-stat"><div class="admin-stat-num">' + listed.length + '</div><div class="admin-stat-label">上架中</div></div>' +
    '<div class="admin-stat"><div class="admin-stat-num">' + oos.length + '</div><div class="admin-stat-label">已售罄</div></div>' +
    '<div class="admin-stat"><div class="admin-stat-num">' + unlisted.length + '</div><div class="admin-stat-label">已下架</div></div>';
}

function renderAdminFilters() {
  const container = document.getElementById('adminCatTabs');
  const chips = [{ id: 'all', name: '全部' }, ...categories];
  container.innerHTML = chips.map(c =>
    '<div class="admin-cat-chip ' + (c.id === adminActiveCat ? 'active' : '') + '" onclick="setAdminCat(\'' + c.id + '\')">' + c.name + '</div>'
  ).join('');
}

function setAdminCat(catId) {
  adminActiveCat = catId;
  renderAdminFilters();
  renderAdminInventory();
}

function renderAdminInventory() {
  const container = document.getElementById('adminInventory');
  const items = adminActiveCat === 'all' ? vegetables : vegetables.filter(v => v.cat === adminActiveCat);
  container.innerHTML = items.map(v => {
    const cls = v.listed ? '' : 'unlisted';
    const stockCls = v.stock <= 0 ? 'zero' : '';
    return '<div class="admin-item ' + cls + '">' +
      '<span class="admin-item-emoji">' + v.emoji + '</span>' +
      '<div class="admin-item-info">' +
        '<div class="admin-item-name">' + v.name + '</div>' +
        '<div class="admin-item-cat">¥' + v.price.toFixed(1) + ' / ' + (categories.find(c=>c.id===v.cat)||{}).name + '</div>' +
      '</div>' +
      '<div class="admin-stock-wrap">' +
        '<button class="admin-stock-btn" onclick="changeStock(\'' + v.id + '\', -1)">−</button>' +
        '<span class="admin-stock-num ' + stockCls + '">' + v.stock + '</span>' +
        '<button class="admin-stock-btn" onclick="changeStock(\'' + v.id + '\', 1)">+</button>' +
      '</div>' +
      '<button class="admin-toggle ' + (v.listed ? 'on' : 'off') + '" onclick="toggleListed(\'' + v.id + '\')" title="上架/下架"></button>' +
    '</div>';
  }).join('');
}

function changeStock(vegId, delta) {
  const v = vegetables.find(vg => vg.id === vegId);
  if (!v) return;
  v.stock = Math.max(0, v.stock + delta);
  saveStock();
  renderAdminInventory();
  renderVegGrid();
}

function toggleListed(vegId) {
  const v = vegetables.find(vg => vg.id === vegId);
  if (!v) return;
  v.listed = !v.listed;
  if (!v.listed) v.stock = 0;
  saveStock();
  renderAdminInventory();
  updateAdminStats();
  renderVegGrid();
}

function checkStock(vegId) {
  const v = vegetables.find(vg => vg.id === vegId);
  if (!v) return false;
  return v.listed && v.stock > 0;
}

function getStock(vegId) {
  const v = vegetables.find(vg => vg.id === vegId);
  return v ? v.stock : 0;
}
</script>

<script>
// ============ INIT ============
initStock();
renderCatTabs();
renderVegGrid();
renderMenuFilters();
renderMenuList();
renderCart();
updateBadges();
</script>

</body>
